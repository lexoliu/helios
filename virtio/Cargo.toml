[package]
name = "helios-virtio"
version = "0.1.0"
edition.workspace = true

[dependencies]
async-lock = { version = "3.4.2", default-features = false }
bitflags = "2.11.0"
fdt = { version = "0.1.5", default-features = false }
bytes = { version = "1.10.1", default-features = false }
event-listener = { version = "5.4.1", default-features = false, features = ["critical-section"] }
helios-hal.workspace = true
helios-netstack.workspace = true
pci_types = "0.10.1"
tracing.workspace = true
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex"] }
thiserror = { version = "2.0.17", default-features = false }

[dev-dependencies]
divan = "0.1.21"
futures-lite = "2.6.1"
zerocopy = { version = "0.8.27", features = ["derive"] }

[[bench]]
name = "net_tx_smp"
harness = false
