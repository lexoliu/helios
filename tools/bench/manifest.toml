# Benchmark-suite manifest: everything a run must match before its numbers
# may be published. Pins that already live elsewhere in the repository
# (the vendored Wasmtime revision, the Fedora image digest, the Wasmtime
# Linux release, the workload list) are read from their single source by
# helios_bench.manifest, not repeated here.

schema_version = 1

[statistics]
# Measured executions per workload and side. The first is reported as the
# cold iteration and excluded from the warm series, leaving ten warm
# iterations for every cell.
iterations = 11
warmup_discard = 1
# A warm series whose coefficient of variation exceeds this bound is
# rejected: the cell is reported, but flagged and excluded from the gate.
cv_bound = 0.15
bootstrap_resamples = 10000
confidence = 0.95
# Fixed seed so the bootstrap intervals in a report can be recomputed
# from its raw iterations.
bootstrap_seed = 20260903

# One lane. Nearly everything this suite measures lives in the
# cross-platform kernel, so a second architecture buys repetition rather
# than coverage, and no hosted GitHub Arm runner can host one anyway:
# they expose no /dev/kvm (probe run 33944339758), which would make an
# Arm lane an interpreter measuring an interpreter. An Arm number comes
# from a dedicated machine or a developer's own arm64 box, by hand.
[[lane]]
name = "x86-64-kvm"
helios_arch = "x86-64"
guest_arch = "x86_64"
accelerator = "kvm"
# The transport the inspector RPC rides. Every Helios row is timed around
# that RPC, and the serial default is QEMU's 16550 — one I/O-port exit
# per byte each way and 10–20 ms inside every elapsed (#413). vhost-vsock
# is the virtio debug transport AGENTS.md names, and the host provisions
# /dev/vhost-vsock for it (.github/actions/vhost-vsock).
rpc_transport = "vsock"
# Dedicated runner: fixed CPU governor, nothing else scheduled
# (docs/benchmarks.md, "Dedicated runners").
runner_label = "helios-bench-x86-kvm"
# GitHub shared runner the same job runs on in advisory mode.
shared_runner = "ubuntu-24.04"
# QEMU release the lane is pinned to; ubuntu-24.04's qemu-system-x86 package.
qemu_version = "8.2.2"
# KVM boots in seconds; a marker hang should fail fast.
boot_timeout_seconds = 300
vcpus = 4
# instance-startup-500 wants about 6.1 GiB of guest (docs/benchmarks.md).
memory = "6G"
linux_vm_memory = "4G"
net_backend = "tap"
net_host = "10.77.0.1"
devices = ["virtio-blk-pci", "virtio-net-pci", "virtio-rng-pci"]

# The aarch64 number docs/benchmarks.md leaves to a dedicated Apple
# Silicon host. No hosted runner can carry it (GitHub's Arm runners have
# no hardware virtualization), so it has no `shared_runner` and never
# enters the workflow matrix: it is run by hand with
# `helios-bench run --lane aarch64-hvf` on the machine itself (#491).
[[lane]]
name = "aarch64-hvf"
helios_arch = "aarch64"
guest_arch = "aarch64"
accelerator = "hvf"
# macOS has no vhost-vsock, so the inspector RPC rides the serial line.
# The compared value on this lane is therefore the launch duration the
# kernel reports, not the host-side round trip (#491).
rpc_transport = "serial"
runner_label = "helios-bench-aarch64-hvf"
qemu_version = "11.1.0"
boot_timeout_seconds = 300
# The host's performance-core count: a vCPU thread that lands on an
# efficiency core is a different machine, not a slower one.
vcpus = 4
# One size for both guests, small enough that either fits an 8 GB host
# with the host's own memory pressure normal.
memory = "2G"
linux_vm_memory = "2G"
# QEMU's user backend is the one backend both guests have on macOS.
net_backend = "user"
net_host = "10.0.2.2"
devices = ["virtio-blk-pci", "virtio-net-device", "virtio-rng-device"]
