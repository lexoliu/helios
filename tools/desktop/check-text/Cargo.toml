[package]
name = "helios-desktop-text-check"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "check-desktop-text"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
# The compositor's own modules: the glyph raster, the cell blend and the
# terminal grid the desktop draws with. Rendering the expected pixels any
# other way would be a second definition of what a character looks like.
helios-compositor = { path = "../../../programs/compositor" }
png = "0.18.0"
thiserror = "2.0.17"

[lints]
workspace = true
