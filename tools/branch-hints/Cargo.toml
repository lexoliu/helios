[package]
name = "helios-branch-hints"
version = "0.1.0"
edition.workspace = true

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
wasm-encoder = "0.245.0"
wasmparser = "0.245.0"

[dev-dependencies]
wasmtime = { path = "../../../wasmtime/crates/wasmtime", default-features = false, features = ["cranelift", "runtime", "std"] }
wat = "1.245.1"

[lints]
workspace = true
