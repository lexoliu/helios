timeout: 0
verbose: yes
serial: yes
serial_baudrate: {{ baud }}
# Extend PCR 9 with the kernel and the bootfs and log them as EV_IPL
# events, which the kernel's measured-boot discovery requires before it
# seals anything to the TPM.
measured_boot: yes
/Helios
    protocol: limine
    kernel_path: boot():/boot/helios
    module_path: boot():/boot/helios-bootfs
    kaslr: no
    randomise_hhdm_base: no
