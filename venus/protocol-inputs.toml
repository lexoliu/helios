# Pinned venus-protocol inputs the `helios-venus` build generates its wire
# protocol from.
#
# Every file is fetched from the upstream repository at one full commit
# SHA (tag v1.1.3) and verified against its SHA-256 before anything reads
# it. `venus/build.rs` performs no network I/O: it reads the cache directory
# and fails naming the missing or mismatching file. The cache is filled by
#
#     cargo run -p helios-cli -- venus-protocol-fetch
#
# into `target/venus-protocol/`. Bumping the protocol means changing the
# commit, every URL and every hash together, then re-reading the policy
# tables in `venus-gen/src/policy.rs` against `vn_protocol.py` and
# `vkxml.py` (the `policy_literals` test fails until they agree).
#
# The three XML hashes are the ones published with the revision study; the
# other hashes were computed over the fetched files.

