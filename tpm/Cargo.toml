[package]
name = "helios-tpm"
version = "0.1.0"
edition.workspace = true

[dependencies]
helios-hal.workspace = true
thiserror = { version = "2.0.20", default-features = false }
tpm2-protocol = { version = "1.2.3", default-features = false }
zeroize = { version = "1.9.1", default-features = false }

[dev-dependencies]
hex = { version = "0.4.3", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tempfile.workspace = true

[lints]
workspace = true
