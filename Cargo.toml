[workspace]
members = [
    "aarch64", "api", "api-macro", "artifact", "cli", "compiler-abi", "compiler-plugin", "compiler-support", "hal", "i6300esb", "hosted", "kernel", "kernel-macro", "netstack", "profdata", "programs/audio-test", "programs/compositor", "programs/compositor/render", "programs/date", "programs/debugger", "programs/display-test", "programs/gpu-test", "programs/http-client", "programs/init", "programs/input-test", "programs/oob-load", "programs/perf", "programs/ping", "programs/procbench", "programs/sched-tasks", "riscv", "tools/branch-hints", "tools/desktop/check-text", "x86", "inspector", "inspector-protocol", "virtio", "workspace-root",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.lints]

[package]
name = "helios"
version = "0.1.0"
edition.workspace = true
# The `helios` name on crates.io belongs to an unrelated project.
publish = false

[workspace.dependencies]
helios-hal = { path = "hal" }
helios-api = { path = "api" }
helios-artifact = { path = "artifact" }
helios-compiler-abi = { path = "compiler-abi" }
helios-compiler-support = { path = "compiler-support" }
helios-hosted = { path = "hosted" }
helios-aarch64 = { path = "aarch64" }
helios-kernel-macro = { path = "kernel-macro" }
helios-inspector-protocol = { path = "inspector-protocol" }
helios-riscv = { path = "riscv" }
helios-kernel = { path = "kernel", default-features = false }
helios-netstack = { path = "netstack" }
helios-profdata = { path = "profdata" }
helios-virtio = { path = "virtio" }
helios-workspace-root = { path = "workspace-root" }
helios-x86 = { path = "x86" }
i6300esb = { path = "i6300esb" }
helios = { path = "." }
crossbeam-utils = { version = "0.8.23", default-features = false }
tracing = { version = "0.1.44",  default-features = false }
wit-bindgen = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"


[target.'cfg(not(target_os = "none"))'.dependencies]
helios-hosted.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
helios-riscv.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
helios-aarch64.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
helios-x86.workspace = true

[dev-dependencies]
helios-inspector-protocol.workspace = true
wasmtime = { path = "../wasmtime/crates/wasmtime", default-features = false, features = ["component-model", "cranelift", "gc-null", "runtime", "std"] }

[profile.dev]
panic = "abort"
debug = 0
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
debug = 0
debug-assertions = false
overflow-checks = false

[profile.dev.package.helios-debugger]
debug = 0
opt-level = "z"

[profile.dev.package.helios-api]
debug = 0
opt-level = "z"

[profile.dev.package.helios-inspector-protocol]
debug = 0
opt-level = "z"

[profile.kernel-debug]
inherits = "dev"
debug = 2
strip = "none"

[profile.kernel-debug.package."*"]
opt-level = 2
debug = 1
debug-assertions = false
overflow-checks = false

[profile.kernel-debug.package.helios]
debug = 2

[profile.kernel-debug.package.helios-kernel]
debug = 2

[profile.kernel-debug.package.helios-riscv]
debug = 2

[profile.kernel-debug.package.helios-x86]
debug = 2

[profile.release]
panic = "abort"

# The kernel image's optimised build, the one every release kernel and both
# PGO kernels below are: `release` plus whole-program optimisation. The
# image links `hal`, `netstack`, `virtio`, the backend, `kernel` and the
# Wasmtime crates, and every hot path crosses those boundaries — the
# executor into the virtio queues, the netstack per segment, a hostcall
# into a WIT service — so a per-crate build leaves each of those calls out
# of line for PGO to weight but never inline. Fat LTO with one codegen unit
# hands the whole image to one optimisation, which is what a collected
# profile is worth the most on. The host tools keep `release`: nothing
# times them, and a fat-LTO link of the inspector on every check would
# be paid by every lane and every developer loop for no measurement.
[profile.kernel-release]
inherits = "release"
lto = "fat"
codegen-units = 1

# The instrumented kernel of docs/pgo.md: the optimised build that also
# carries LLVM's counters. The instrumentation itself comes from rustflags,
# which are not a profile setting; `helios-inspector vm --profile-generate`
# adds them and this profile keeps the artifacts in a directory of their own,
# so an instrumented image and a plain one never overwrite each other.
[profile.profile-generate]
inherits = "kernel-release"

# The PGO kernel of docs/pgo.md: the same optimised build reading a
# collected profile. `-C profile-use` is a rustflag rather than a profile
# setting, and `helios-inspector vm --profile-use` adds it; the profile
# exists so that a PGO image and a plain release image can be built from
# one checkout and timed against each other without overwriting each
# other's artifacts.
[profile.profile-use]
inherits = "kernel-release"

[lints]
workspace = true
