name: Provision vhost-vsock
description: >-
  Makes `/dev/vhost-vsock` usable by the runner's own account, so a guest
  booted with `--rpc-transport vsock` gets its device. vsock is the only
  inspector transport whose host half needs a kernel module, and the
  inspector refuses rather than falling back, so a runner without it fails
  the boot that asked for it loudly rather than measuring the serial line.
runs:
  using: composite
  steps:
    - name: Provision vhost-vsock
      shell: bash
      run: |
        sudo modprobe vhost_vsock
        sudo udevadm settle
        # udev creates the node root:kvm mode 0660 and the runner
        # account is not in that group, so QEMU's vhost backend cannot
        # open it. Hand the node to this account before asking for it.
        sudo chmod 0666 /dev/vhost-vsock
        ls -l /dev/vhost-vsock
