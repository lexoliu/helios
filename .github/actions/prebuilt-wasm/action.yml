name: Download the run's prebuilt guest wasm
description: >-
  Waits for the `wasm-programs` job of this run to upload the guest wasm of
  one profile, then downloads it. The lane that calls it runs in parallel
  with that job, so this is the step placed right before the lane's first
  kernel prebuild. It waits for as long as the job is queued or running,
  whose own timeout bounds that, and fails at once when the job concluded
  with anything but success, when it succeeded without the artifact, and
  when the run has not listed the job within the bound. The calling job
  needs `actions: read`.
inputs:
  profile:
    description: The guest programs' cargo profile, `release` or `debug`.
    required: true
  path:
    description: Directory to download into, relative to the workspace.
    required: true
  timeout-seconds:
    description: How long to wait for the run to list the job.
    required: false
    default: "1800"
runs:
  using: composite
  steps:
    - name: Wait for the wasm-programs job
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROFILE: ${{ inputs.profile }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        artifact="helios-wasm-${PROFILE}"
        job="wasm-programs (${PROFILE})"
        run="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        uploaded() {
          [[ -n "$(gh api --paginate "${run}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${artifact}\" and (.expired | not)) | .id")" ]]
        }
        deadline=$((SECONDS + TIMEOUT_SECONDS))
        while true; do
          if uploaded; then
            echo "${artifact} is uploaded"
            exit 0
          fi
          # "<status> <conclusion>", empty while the run does not list the job.
          state="$(gh api --paginate "${run}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq ".jobs[] | select(.name == \"${job}\") | \"\(.status) \(.conclusion // \"\")\"")"
          case "${state}" in
            "")
              if ((SECONDS >= deadline)); then
                echo "::error::this run listed no '${job}' job within ${TIMEOUT_SECONDS} s, so ${artifact} will not appear"
                exit 1
              fi
              ;;
            "completed success")
              # The upload is the job's last step, so the artifact exists
              # by now or never will.
              if uploaded; then
                echo "${artifact} is uploaded"
                exit 0
              fi
              echo "::error::the '${job}' job of this run succeeded without uploading ${artifact}"
              exit 1
              ;;
            completed\ *)
              echo "::error::the '${job}' job of this run concluded '${state#completed }', so ${artifact} will not appear"
              exit 1
              ;;
            # Queued or running: a producer that waited for a runner is
            # late, not failed, and its own timeout bounds the wait.
          esac
          sleep 10
        done
    - uses: actions/download-artifact@v4
      with:
        name: helios-wasm-${{ inputs.profile }}
        path: ${{ inputs.path }}
