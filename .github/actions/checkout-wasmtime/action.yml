name: Checkout the pinned Wasmtime tree
description: >-
  Checks out the pinned Helios Wasmtime fork revision that the workspace's
  `../wasmtime` path dependency builds against, next to the `helios/`
  checkout. The pin lives here so every workflow resolves the same tree;
  update it together with docs/wasmtime.md.
inputs:
  path:
    description: Directory to check the tree out into, relative to the workspace.
    required: false
    default: wasmtime
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: lexoliu/wasmtime
        ref: 92d5703c3e8888cd719681d4205fc2c9f92bde97
        path: ${{ inputs.path }}
