name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check-host
            command: just check-host
          - name: check-aarch64
            command: just check-target aarch64-unknown-none helios-aarch64
          - name: check-riscv
            command: just check-target riscv64gc-unknown-none-elf helios-riscv
          - name: check-x86
            command: just check-target x86_64-unknown-none helios-x86
          - name: test-embedded-debugger
            command: just test-embedded-debugger
          # `just lint` runs these five gates back to back locally; CI
          # splits them so a lint failure names the surface it came from
          # and each lane keeps its own build cache.
          - name: lint-fmt
            command: just fmt-check && just deny-check
          - name: lint-host
            command: just clippy-host && just clippy-programs
          - name: lint-aarch64
            command: just clippy-target aarch64-unknown-none helios-aarch64
          - name: lint-riscv
            command: just clippy-target riscv64gc-unknown-none-elf helios-riscv
          - name: lint-x86
            command: just clippy-target x86_64-unknown-none helios-x86
          - name: test-units
            command: just test-units
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,cargo-deny,nextest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helios
          key: ${{ matrix.name }}
      - name: ${{ matrix.name }}
        working-directory: helios
        run: ${{ matrix.command }}

  smoke-riscv64:
    name: smoke-riscv64
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build \
            qemu-system-misc opensbi
          qemu-system-riscv64 --version
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helios
          key: smoke-riscv64
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      - name: Boot riscv64 guest
        shell: bash
        working-directory: helios
        env:
          # GitHub runners expose no riscv64 accelerator, so the guest runs
          # under TCG and needs an emulation-sized bring-up budget.
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/boot"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-smoke.out | tee "$runtime/inspector.log"
          cat boot-smoke.out
          grep -Fqx ok boot-smoke.out
      - name: Seed the wall clock from the goldfish RTC
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # The kernel reads the goldfish RTC before any program runs, so
          # a guest asking wasi:clocks/wall-clock must agree with the
          # runner's own clock. Comparing the two is what distinguishes a
          # seeded clock from one that only counts uptime; the kernel's
          # own seed line stays in the trace history on this backend,
          # which does not mirror kernel logs to the serial.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/wall-clock"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program date \
            --no-compiler-plugin \
            shell -c '/bin/date' > wall-clock-smoke.out 2>&1
          cat wall-clock-smoke.out
          guest_epoch="$(sed -n 's/^unix_seconds=\([0-9][0-9]*\).*$/\1/p' wall-clock-smoke.out | tail -n 1)"
          host_epoch="$(date +%s)"
          skew=$(( guest_epoch > host_epoch ? guest_epoch - host_epoch : host_epoch - guest_epoch ))
          echo "guest ${guest_epoch}, host ${host_epoch}, skew ${skew}s"
          test "${skew}" -le 60
      - name: Run the coreutils applets through dash
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # coreutils is one multicall WASIX module published under several
          # bootfs names, so every applet is launched by bare name and dash
          # resolves it through PATH. Issue #39 died here on riscv64.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/coreutils"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program mkdir --boot-program cat \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c 'mkdir /d; echo coreutils:ok > /d/f; cat /d/f; ls /' \
            2>&1 > coreutils-smoke.out | tee "$runtime/inspector.log"
          cat coreutils-smoke.out
          grep -Fqx coreutils:ok coreutils-smoke.out
          grep -Fqx bin coreutils-smoke.out
      - name: Run CPython
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Same interpreter and one-liner as tools/wasi-apps/smoke.sh, so the
          # riscv64 lane covers the stdlib import path that issue #39 broke.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/cpython"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program python3 \
            --no-compiler-plugin \
            shell -c 'python3 -c "import json, pathlib; print(json.dumps({\"ok\": pathlib.PurePosixPath(\"/a\").name}, separators=(\",\",\":\")))"' \
            2>&1 > cpython-smoke.out | tee "$runtime/inspector.log"
          cat cpython-smoke.out
          grep -Fqx '{"ok":"a"}' cpython-smoke.out
      - name: Trap an out-of-bounds guest load
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program oob-load \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - name: Boot riscv64 guest with the inspector RPC on vsock
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # vsock is the only transport whose host half needs a kernel
          # module, and the inspector refuses rather than falling back,
          # so a runner without it fails this step loudly.
          sudo modprobe vhost_vsock
          sudo udevadm settle
          # udev creates the node root:kvm mode 0660 and the runner
          # account is not in that group, so QEMU's vhost backend cannot
          # open it. Hand the node to this account before asking for it.
          sudo chmod 0666 /dev/vhost-vsock
          ls -l /dev/vhost-vsock
          id
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --rpc-transport vsock \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' > vsock-smoke.out
          cat vsock-smoke.out
          grep -Fqx ok vsock-smoke.out
      - name: Fetch over virtio-net with curl
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # curl speaks wasi:http, which the kernel forwards to the
          # http-client plugin, so both boot programs are required. curl is
          # invoked by bare name so dash resolves it through PATH and execs
          # it with argv[0] == "curl", which is the shape that regressed in
          # issue #35; tools/wasi-apps/smoke.sh covers the bootfs-path shape.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/curl"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program curl --boot-program http-client --no-compiler-plugin \
            shell -c 'curl http://detectportal.firefox.com/success.txt' 2>&1 > curl-smoke.out | tee "$runtime/inspector.log"
          cat curl-smoke.out
          grep -Fqx success curl-smoke.out
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-riscv64-runtime
          # The guest console and QEMU's own stdout, stderr and -d logs.
          # GitHub drops a step's log outright when it cannot render it, so
          # what a failing smoke needs has to leave the job as a file rather
          # than as console output. The disk images the runtime directory
          # also holds are deliberately not collected.
          path: |
            smoke-runtime/*/*.log
          if-no-files-found: warn
          retention-days: 7

  # A native Arm Linux runner under multi-threaded TCG. This lane is a
  # functional check, not a performance surface: `ubuntu-24.04-arm`
  # publishes no `/dev/kvm` at all — `-accel kvm` there fails with
  # "Could not access KVM kernel module" (probe run 33944339758) — so
  # both boots below ask for `--accel tcg` on purpose. The inspector
  # requires a profile's native accelerator when nobody names one, so a
  # lane that means to measure the emulator has to say so (#118).
  #
  # The QEMU 8.2 that Ubuntu 24.04 ships asserts in its emulated GICv3
  # CPU interface under multi-threaded TCG
  # (`gicv3_cpuif_update: assertion failed: (qemu_mutex_iothread_locked())`,
  # issue #85), and no archive that is safe to mix into noble carries a
  # newer one: the cloud archive ships OpenStack only, noble-backports
  # has no emulator at all, and a package from a later Ubuntu or from
  # Debian trixie would pull its own glibc onto the runner. So the lane
  # builds a pinned upstream release once and caches the install prefix
  # by version. The tarball also installs the EDK2 blobs the aarch64
  # boot needs, which the inspector finds through the prefix.
  smoke-aarch64:
    name: smoke-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      QEMU_VERSION: "11.1.1"
      # download.qemu.org publishes a detached signature but no checksum
      # file; this is the digest of the tarball that signature covers.
      QEMU_SHA256: 079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482
      QEMU_PREFIX: ${{ github.workspace }}/qemu-install
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build \
            python3-venv pkg-config flex bison \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev zlib1g-dev
          # Recorded rather than required: the accelerator is picked by
          # capability and today's Arm runners publish no KVM node.
          ls -la /dev/kvm || echo 'no /dev/kvm on this runner'
      - name: Restore the pinned QEMU install prefix
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QEMU_PREFIX }}
          key: qemu-${{ env.QEMU_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build the pinned QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="qemu-${QEMU_VERSION}.tar.xz"
          curl -fsSLO "https://download.qemu.org/${tarball}"
          echo "${QEMU_SHA256}  ${tarball}" | sha256sum -c -
          tar xf "${tarball}"
          cd "qemu-${QEMU_VERSION}"
          # aarch64-softmmu is the only target this lane boots, and the
          # inspector's default network backend is `user`, which has been
          # external libslirp since 8.0.
          ./configure \
            --prefix="${QEMU_PREFIX}" \
            --target-list=aarch64-softmmu \
            --enable-slirp \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-vnc
          ninja -C build install
      - name: Put the pinned QEMU on PATH
        run: |
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Record the QEMU in use
        run: |
          command -v qemu-system-aarch64
          qemu-system-aarch64 --version
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          git clone --depth 1 --branch v11.x-binary \
            https://github.com/limine-bootloader/limine "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helios
          key: smoke-aarch64
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      # The aarch64 backend takes its whole platform description from
      # the firmware, and QEMU's `virt` publishes a device tree or ACPI
      # tables but never both. Both descriptions have to boot, so the
      # same smoke runs twice and each mode asserts which one the kernel
      # actually used.
      - name: Boot aarch64 guest from the device tree
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/device-tree"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-dt.out | tee "$runtime/inspector.log"
          cat boot-dt.out
          grep -Fqx ok boot-dt.out
          grep -F 'platform described by device-tree' "$runtime/inspector.log"
          # The `virt` board's PL061 GPIO controller is hardware the
          # kernel has no driver for, so discovery offers it to a
          # user-mode one. This asserts the whole path from the device
          # tree to a published grant, which is the only thing that
          # proves the walk still sees a real device rather than
          # nothing.
          grep -F 'device grant published device=pl061@9030000' "$runtime/inspector.log"
      # The same guest under the same accelerator as the device-tree
      # boot above, described the other way. ACPI carries no counterpart
      # to `/chosen/rng-seed`, so this boot's seed comes from the CPU's
      # FEAT_RNG and the bring-up read of the virtio-rng device rather
      # than from the firmware.
      - name: Boot aarch64 guest from ACPI
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/acpi"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-acpi.out | tee "$runtime/inspector.log"
          cat boot-acpi.out
          grep -Fqx ok boot-acpi.out
          grep -F 'platform described by acpi' "$runtime/inspector.log"
          # The ACPI walk looks for virtio transports by hardware id and
          # names nothing else, so an ACPI-described machine publishes
          # no grants. Asserting the absence keeps that a stated fact
          # rather than something that quietly starts or stops being
          # true.
          ! grep -qF 'device grant published' "$runtime/inspector.log"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-aarch64-runtime
          path: |
            smoke-runtime/*/*.log
          if-no-files-found: warn
          retention-days: 7

  smoke-x86-64:
    name: smoke-x86-64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 180
    env:
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      # Every boot below names `--accel kvm`. The inspector no longer
      # falls through to the emulator on its own, and this runner does
      # publish /dev/kvm (probe run 33944339758), so a run that lost it
      # should say so rather than quietly take twenty times as long.
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build \
            qemu-system-x86 ovmf
          qemu-system-x86_64 --version
          # The inspector picks the accelerator by capability; this only
          # fixes the permissions on the node when the runner has one.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          git clone --depth 1 --branch v11.x-binary \
            https://github.com/limine-bootloader/limine "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helios
          key: smoke-x86-64
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector -p helios-desktop-text-check
      # Every x86-64 release build is built against the kernel profile
      # the newest kernel-profile.yml run on the default branch uploaded
      # (docs/pgo.md, #226, #313); the inspector refuses to build one
      # without it rather than producing a plain kernel wearing a PGO
      # label, so the fetch comes before the build. Reading the artifact
      # is what the job's `actions: read` is for.
      - name: Fetch the kernel profile
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release -p helios-cli -- profile-fetch
      - name: Boot x86-64 guest
        shell: bash
        working-directory: helios
        run: |
          # Nothing covered x86-64 booting a guest, so a regression in
          # its PCI bring-up or its memory split reached `dev` twice
          # before anyone ran it by hand: issue #74. This step is the
          # thing that would have caught both.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/boot"
          mkdir -p "$runtime"
          # The three virtio-input functions ride on this boot rather
          # than on one of their own: input bring-up is part of PCI
          # bring-up, and a machine with a desktop presents keyboard,
          # pointer and tablet at once, which is also what proves the
          # backend installs every function it finds rather than the
          # first (#301). This is the only x86-64 KVM boot that carries
          # them; the developer machines have no KVM.
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --qemu-arg -device --qemu-arg virtio-keyboard-pci \
            --qemu-arg -device --qemu-arg virtio-mouse-pci \
            --qemu-arg -device --qemu-arg virtio-tablet-pci \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-smoke.out | tee "$runtime/inspector.log"
          cat boot-smoke.out
          grep -Fqx ok boot-smoke.out
          # The kernel writes its boot lines to the one UART the guest
          # has, and `debug-serial.log` is the host's raw copy of it.
          grep -F 'virtio-input online' "$runtime/debug-serial.log"
          test "$(grep -cF 'virtio-input online' "$runtime/debug-serial.log")" -eq 3
      - name: Run the coreutils applets through dash
        shell: bash
        working-directory: helios
        run: |
          # coreutils is one multicall WASIX module published under
          # several bootfs names, so every applet is launched by bare
          # name and dash resolves it through PATH.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/coreutils"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program mkdir --boot-program cat \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c 'mkdir /d; echo coreutils:ok > /d/f; cat /d/f; ls /' \
            2>&1 > coreutils-smoke.out | tee "$runtime/inspector.log"
          cat coreutils-smoke.out
          grep -Fqx coreutils:ok coreutils-smoke.out
          grep -Fqx bin coreutils-smoke.out
      - name: Run CPython twice and record its launch phases
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Issue #311's fixed per-launch cost lives somewhere in the
          # exec path; on aarch64/HVF the trace cleared the bootfs read,
          # the signature check and 9p, leaving the x86-specific memory
          # path unmeasured (#352). This boot is the KVM measurement:
          # --enable-target opens helios_kernel::exec::phases on the
          # kernel console filter, two python3 launches give one cold
          # and one warm split, and debug-serial.log is the artifact the
          # orchestrator reads the split from. docs/benchmarks.md lists
          # the phase names.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/cpython-phases"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program python3 \
            --no-compiler-plugin \
            --enable-target helios_kernel::exec::phases \
            shell -c 'python3 -c "print(1)"; python3 -c "print(2)"' \
            2>&1 > cpython-phases-smoke.out | tee "$runtime/inspector.log"
          cat cpython-phases-smoke.out
          # `program` is the launched program's name in every phase
          # event: the path on the RPC boundaries, the argv program name
          # inside the load and run phases — both name python3 here.
          phases="$(grep -F 'python3' "$runtime/debug-serial.log")"
          echo "$phases"
          # Two launches arrived, one cold and one warm: the deserialize
          # boundary exists once, the warm launch's deserialize-cache
          # lookup hits, and each launch brackets its guest run.
          test "$(echo "$phases" | grep -cF 'phase=rpc-arrival')" -eq 2
          test "$(echo "$phases" | grep -cF 'phase=deserialize')" -eq 1
          test "$(echo "$phases" | grep -cF 'phase=cache-lookup kind=component hit=true')" -eq 1
          test "$(echo "$phases" | grep -cE 'phase=guest-(begin|end)')" -eq 4
      - name: Compile a guest with the in-kernel compiler plugin
        shell: bash
        working-directory: helios
        run: |
          # The step that #74 actually died in. The plugin's shared memory
          # is the largest single reservation the user address space is
          # asked for, and its declared maximum is still capped by what the
          # user pool could serve, so this remains the step that proves the
          # pool answers a plugin-sized request.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/compiler"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            shell --trace-log "$runtime/guest-tracing.log" -c 'echo compiler:ok' \
            2>&1 > compiler-smoke.out | tee "$runtime/inspector.log"
          cat compiler-smoke.out
          grep -Fqx compiler:ok compiler-smoke.out
      - name: Trap an out-of-bounds guest load
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program oob-load \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - name: Fetch over virtio-net with curl
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The counterpart of smoke-riscv64's curl step, and what #86
          # died in twice over: nothing here drove the NIC, because the
          # balloon service had wedged the bootstrap processor's
          # executor, and once it did drive the NIC the transmit queue's
          # MSI-X message landed on a vector the routing table did not
          # know. Both are x86-only, and neither is visible from any
          # step that does not move a packet.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/curl"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program curl --boot-program http-client --no-compiler-plugin \
            shell -c 'curl http://detectportal.firefox.com/success.txt' \
            2>&1 > curl-smoke.out | tee "$runtime/inspector.log"
          cat curl-smoke.out
          grep -Fqx success curl-smoke.out
      - name: Draw on the display and capture the scanout
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The desktop devices on the PCI machine: a virtio-GPU that
          # replaces q35's default VGA adapter, the keyboard and both
          # pointers, and a virtio-sound device playing into the `wav`
          # sink, which needs no host audio at all. The capture is taken
          # with no host display backend — the whole point of reading the
          # scanout through QMP is that a headless runner sees what a
          # window would have shown (docs/desktop.md).
          #
          # `display-test` claims the display through
          # `helios:system/display`, fills a surface with a gradient whose
          # colour at every pixel is a function of that pixel's position,
          # and keeps presenting while the captures are taken. The
          # gradient is what makes the capture evidence: a display
          # nothing ever attached a resource to also
          # produces a valid PNG, and only the pixels tell the two apart.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none --audiodev "wav:$runtime/desktop.wav" \
            --qemu-trace trace:virtio_gpu_update_cursor \
            --qemu-trace-log "$runtime/qemu-trace.log" \
            --boot-program dash --boot-program debugger \
            --boot-program display-test --no-compiler-plugin \
            screendump \
              --run /bin/display-test --run-arg --seconds --run-arg 20 \
              --settle-seconds 2 "$captures/drawn.png" "$captures/settled.png" \
            2>&1 | tee "$runtime/inspector.log"
          # A PPM under a .png name would be an artifact nothing opens,
          # so the format QEMU was asked for is the format checked.
          for capture in "$captures/drawn.png" "$captures/settled.png"; do
            test -s "$capture"
            file "$capture" | grep -Fq 'PNG image data'
          done
          # The guest's own account of what it drew, and the picture's.
          grep -Fq 'display-test:claimed' "$runtime/inspector.log"
          grep -Eq 'display-test:surface scanout=0 width=[0-9]+ height=[0-9]+' \
            "$runtime/inspector.log"
          grep -Fq 'display-test:cursor-set' "$runtime/inspector.log"
          grep -Eq 'display-test:frame sequence=[0-9]+ cursor=[0-9]+,[0-9]+' \
            "$runtime/inspector.log"
          # The sound device `--audiodev` attached to this boot. The
          # driver's own line is what says the device answered its three
          # bring-up queries, and this is the only lane whose guest has a
          # sound device at all (#305). The kernel writes its boot lines
          # to the one UART the guest has, and `debug-serial.log` is the
          # host's raw copy of it.
          grep -Eq 'virtio-snd online transport=pci streams=[0-9]+ jacks=[0-9]+ rates=[0-9]+\.\.[0-9]+ formats=[A-Z0-9,]+' \
            "$runtime/debug-serial.log"
          python3 tools/desktop/check-gradient.py \
            "$captures/drawn.png" "$captures/settled.png"
          # The pointer is a plane the capture does not hold, so the device's
          # own trace of every cursor command is checked against the
          # positions the guest says it moved to.
          python3 tools/desktop/check-cursor.py \
            "$runtime/inspector.log" "$runtime/qemu-trace.log"
      - name: Read the desktop's input devices from the guest
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A second boot rather than a second action on the first: one
          # session runs one action, and weakening either half — a
          # capture taken while nothing is drawing, or an input script
          # sent before anything claimed the devices — would leave the
          # evidence unattributable.
          #
          # `input-test` claims every device `helios:system/input` lists
          # and prints each event it is handed, `SYN_REPORT` included.
          # The script then presses one key and moves the tablet, so the
          # guest's own output is what says the events crossed the whole
          # path: virtio ring, kernel drain, bounded queue, p3 stream.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-input"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --boot-program dash --boot-program debugger \
            --boot-program input-test --no-compiler-plugin \
            input tools/desktop/input-probe.input \
              --run /bin/input-test --run-arg --seconds --run-arg 12 \
              --settle-seconds 3 --interval-ms 200 \
            2>&1 | tee "$runtime/inspector.log"
          # The guest claimed the devices before it read anything.
          grep -Eq 'input-test:claimed device=QEMU Virtio (Keyboard|Tablet)' \
            "$runtime/inspector.log"
          grep -Eq 'input-test:reading devices=[1-9]' "$runtime/inspector.log"
          # The four evdev events the script produced, in the order the
          # guest was handed them. `awk` rather than four greps: what is
          # being asserted is the order, and each `grep` on its own would
          # pass on a capture that had them backwards.
          grep -F 'input-test:event' "$runtime/inspector.log" \
            | awk '
                /kind=EV_KEY/                  && stage == 0 { stage = 1; next }
                /kind=EV_SYN code=SYN_REPORT/  && stage == 1 { stage = 2; next }
                /kind=EV_ABS code=ABS_X/       && stage == 2 { stage = 3; next }
                /kind=EV_ABS code=ABS_Y/       && stage == 3 { stage = 4; next }
                /kind=EV_SYN code=SYN_REPORT/  && stage == 4 { stage = 5; exit }
                END {
                  if (stage != 5) {
                    print "input-test reported no EV_KEY, EV_SYN, EV_ABS x, EV_ABS y, " \
                          "EV_SYN in that order (reached stage " stage ")" > "/dev/stderr"
                    exit 1
                  }
                }'
          # A report lost is a reader that did not keep up, and this run
          # injects a handful of events into a queue 64 deep.
          ! grep -Fq 'input report was dropped' "$runtime/inspector.log"
      - name: Boot the desktop with the compositor and type at its terminal
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A third desktop boot, for the third claim. The two above
          # prove the services — a display a guest can draw on, input a
          # guest can read — and this one proves the program that owns
          # both at once: the compositor claims the display and every
          # input device, draws a desktop, runs the shell in a terminal
          # on it, and puts what is typed at it on the screen.
          #
          # No `--no-compiler-plugin` here, unlike the two boots above:
          # the compositor spawns `/bin/dash`, which is a raw wasm the
          # in-kernel compiler has to turn into an artifact first.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-compositor"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --qemu-trace trace:virtio_gpu_update_cursor \
            --qemu-trace-log "$runtime/qemu-trace.log" \
            --boot-program dash --boot-program debugger \
            --boot-program compositor \
            screendump \
              --input tools/desktop/desktop-probe.input --input-interval-ms 150 \
              --settle-seconds 20 "$captures/compositor.png" \
            2>&1 | tee "$runtime/inspector.log"
          # A PPM under a .png name would be an artifact nothing opens.
          test -s "$captures/compositor.png"
          file "$captures/compositor.png" | grep -Fq 'PNG image data'
          # The compositor's own account: it claimed the display, laid a
          # terminal out on it, and presented a frame per keystroke.
          grep -Eq 'compositor:online scanout=0 width=[0-9]+ height=[0-9]+' \
            "$runtime/inspector.log"
          grep -Eq 'compositor:frame sequence=[0-9]+ regions=[0-9]+ cursor=[0-9]+,[0-9]+' \
            "$runtime/inspector.log"
          # Where the terminal put its top-left cell, read from the
          # guest's own line rather than assumed: the layout is the
          # desktop's business, and a check that guessed it would be
          # checking a different rectangle.
          origin="$(sed -n 's/.*compositor:terminal .*origin=\([0-9]*,[0-9]*\).*/\1/p' \
            "$runtime/inspector.log" | head -1)"
          test -n "$origin"
          # The pixels of the two rows the script produced, against the
          # same glyphs rendered by the same font crate the compositor
          # draws with — `tools/desktop/check-text` links the modules the
          # compositor draws with (`programs/compositor/render`), so the
          # check and the desktop cannot disagree about what an `h`
          # looks like. A capture that is a
          # valid PNG of a desktop showing nothing passes every check
          # above and fails this one.
          #
          # `helios$ ` is the prompt the compositor gave the shell it
          # spawned, `echo hello` is what the terminal echoed as the
          # script typed it, and `hello` on the row below is what the
          # shell printed back — which together is the whole path:
          # keyboard, focus, terminal, shell, terminal, scanout.
          ./target/release/check-desktop-text \
            --capture "$captures/compositor.png" --origin "$origin" \
            --expect '0,0=helios$ echo hello' --expect '1,0=hello'
          # The pointer is a plane the capture does not hold, so the
          # device's own trace of every cursor command is checked against
          # the positions the guest says it moved to.
          python3 tools/desktop/check-cursor.py \
            "$runtime/inspector.log" "$runtime/qemu-trace.log"
      - name: Kill the compositor and watch the supervisor bring it back
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A restart is one machine before and after, so this is one
          # boot with three captures: the desktop, the machine with the
          # compositor gone, and the desktop the supervisor put back.
          # `--kill-instance` stops the instance once the first capture
          # is taken and `--kill-settle-ms` is the interval the second is
          # meant to catch, before the rebuild has finished.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-restart"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --boot-program dash --boot-program debugger \
            --boot-program compositor \
            screendump \
              --input tools/desktop/desktop-probe.input --input-interval-ms 150 \
              --settle-seconds 20 \
              --kill-instance compositor-plugin --kill-settle-ms 200 \
              "$captures/restart-before.png" \
              "$captures/restart-blank.png" \
              "$captures/restart-after.png" \
            2>&1 | tee "$runtime/inspector.log"
          for capture in restart-before restart-blank restart-after; do
            test -s "$captures/$capture.png"
            file "$captures/$capture.png" | grep -Fq 'PNG image data'
          done
          # The kill reached the instance, and the supervisor said so.
          grep -Fq 'reason=Operator' "$runtime/inspector.log"
          grep -Fq 'the compositor died; rebuilding it' "$runtime/inspector.log"
          # Two `compositor online` lines: the one that booted, and the
          # one the supervisor built after the kill. One would mean
          # nothing died.
          online="$(grep -c 'compositor online instance=' "$runtime/inspector.log")"
          test "$online" -ge 2
          origin="$(sed -n 's/.*compositor:terminal .*origin=\([0-9]*,[0-9]*\).*/\1/p' \
            "$runtime/inspector.log" | head -1)"
          test -n "$origin"
          # Before: the desktop, with the command and its output on it.
          ./target/release/check-desktop-text \
            --capture "$captures/restart-before.png" --origin "$origin" \
            --expect '0,0=helios$ echo hello' --expect '1,0=hello'
          # In between: nothing. The display is the compositor's claim
          # and the kernel released it with the instance that held it, so
          # there is no frame buffer for the engine to scan out.
          if ./target/release/check-desktop-text \
              --capture "$captures/restart-blank.png" --origin "$origin" \
              --expect '0,0=helios$ echo hello'; then
            echo "the scanout still showed the dead compositor's terminal" >&2
            exit 1
          fi
          # After: a desktop again, with a fresh terminal rather than the
          # dead one's — a restarted compositor rebuilds the desktop, it
          # does not recover the old one's scrollback.
          ./target/release/check-desktop-text \
            --capture "$captures/restart-after.png" --origin "$origin" \
            --expect '0,0=helios$ '
      - name: Play a tone through the desktop's sound device
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A boot of its own, for the same reason the input probe has
          # one: this session's whole job is the recording, and a capture
          # taken while `display-test` was also driving the machine could
          # not be attributed to the audio path.
          #
          # `--audiodev` alone attaches the virtio-sound device — the
          # desktop's display and input adapters are not needed to make a
          # sound — and the `wav` backend writes what the device played
          # to a file, so a headless runner with no sound card at all
          # produces the same recording a speaker would have made
          # (docs/desktop.md).
          #
          # `audio-test` claims the playback stream through
          # `helios:system/audio`, negotiates 48 kHz stereo S16 and
          # writes two seconds of a 440 Hz sine into it. The tone is the
          # evidence: a device nothing ever sent a period to also leaves
          # a valid WAV header behind, and only the samples tell the two
          # apart.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-audio"
          evidence="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$evidence"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --audiodev "wav:$evidence/tone.wav" \
            --boot-program dash --boot-program debugger \
            --boot-program audio-test --no-compiler-plugin \
            shell -c '/bin/audio-test --seconds 2' \
            2>&1 > audio-smoke.out | tee "$runtime/inspector.log"
          cat audio-smoke.out
          # The driver answered its bring-up queries before any of this.
          grep -Eq 'virtio-snd online transport=pci streams=[0-9]+ jacks=[0-9]+ rates=[0-9]+\.\.[0-9]+ formats=[A-Z0-9,]+' \
            "$runtime/debug-serial.log"
          # The kernel's own account: the service came up, and the stream
          # was configured with what the guest asked for rather than with
          # the nearest thing the device offered.
          grep -Fq 'audio service online' "$runtime/debug-serial.log"
          grep -Eq 'playback stream negotiated .*rate=48000 channels=2' \
            "$runtime/debug-serial.log"
          # The guest's own account, in the order the path runs in.
          grep -Eq 'audio-test:claimed stream=[0-9]+' audio-smoke.out
          grep -Fq 'audio-test:negotiated rate=48000 channels=2 format=S16' \
            audio-smoke.out
          grep -Eq 'audio-test:wrote bytes=384000 frames=96000' audio-smoke.out
          # An underrun is a period the kernel had nothing to play, and
          # nothing substitutes silence for it (#306), so a run that
          # reports one produced a recording with a hole in it.
          grep -Eq 'audio-test:done latency-bytes=[0-9]+ xruns=0' audio-smoke.out
          # And the recording itself: two seconds of one partial at the
          # frequency the guest generated.
          test -s "$evidence/tone.wav"
          file "$evidence/tone.wav" | grep -Fq 'WAVE audio'
          python3 tools/desktop/check-tone.py "$evidence/tone.wav" \
            --hz 440 --seconds 2
      - name: Upload the desktop scanout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-desktop
          # The pictures, the recording, and nothing else. A kernel image
          # carries the signing material the guest verifies its own
          # artifacts with and never leaves the job.
          path: |
            desktop-scanout/*.png
            desktop-scanout/*.wav
          if-no-files-found: warn
          retention-days: 7
      # The host keeps its own copy of the debug serial, written by the
      # QEMU chardev before the inspector frames a byte of it. A stage
      # marker broken in that copy was lost inside QEMU's transmit
      # path; one broken only in the framed output above was lost by
      # the reader (#102). x86-64 is the lane where either happens,
      # because its console mirror streams the whole boot log through
      # COM1 exactly while the application processors come online.
      - name: Check the raw debug serial captures
        if: always()
        shell: bash
        working-directory: helios
        run: python3 tools/debug-serial-report.py "$GITHUB_WORKSPACE/smoke-runtime"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-runtime
          # The guest console and QEMU's own stdout, stderr and -d logs.
          # A failing smoke needs its evidence to leave the job as a file
          # rather than as console output.
          path: |
            smoke-runtime/*/*.log
          if-no-files-found: warn
          retention-days: 7

  bench:
    name: bench-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    # The lane builds the inspector and the guest, then boots once per
    # workload class; a healthy run is around half an hour. The runner's
    # own per-iteration deadline is what catches a hung workload, so
    # this only has to catch a hang the runner cannot see — a build or a
    # boot that never finishes — and it is set close enough to a real
    # run that it does so in the same hour rather than three hours
    # later.
    timeout-minutes: 75
    env:
      HELIOS_NET_IFNAME: helios0
      HELIOS_NET_BRIDGE: helios-br0
      NET_BOOT_LOG: ${{ github.workspace }}/helios-bench-boot.log
      BENCH_RUNTIME_DIR: ${{ github.workspace }}/bench-runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64-linux
            runner: ubuntu-24.04
            helios-arch: x86-64
            vm-memory: 2G
            # Named rather than probed: a benchmark that quietly measured
            # the emulator would be worse than no benchmark (#118), and
            # this runner does publish /dev/kvm (probe run 33944339758).
            accel: kvm
            # KVM boots in seconds; a marker hang should fail fast.
            boot-timeout: "300"
            # `instance-startup-100` gates this lane again. Neither
            # thing that used to refuse it does now: the boot memory
            # policy leaves all usable memory in the user pool and lets
            # the kernel heap draw on it (#130), and the executor's task
            # arena is a share of the machine rather than a fixed 1 MiB
            # array (#159, #142), which on this 2 GiB guest is 7.25 MiB
            # per processor against the ~8.5 KiB a live instance costs
            # one. See docs/memory.md.
            #
            # `instance-startup-500` stays out, and for the machine
            # rather than the executor: 500 instances want about 6.1 GiB
            # of guest before the kernel's own baseline and this one has
            # 2 GiB, so the cell would fail on memory whatever the arena
            # holds. Measuring it needs a bigger guest, not a different
            # kernel, and a failed cell is not something this lane is
            # taught to tolerate.
            workloads: >-
              --skip-workload instance-startup-500
            # Linux runners allow sudo, so the network workloads run over
            # a multi-queue tap with vhost-net: the only host packet path
            # on which the guest's virtio-net multiqueue, checksum and
            # TSO paths exist at all. See docs/networking.md.
            net-backend: tap
            net-host: 10.77.0.1
          # This is the only benchmark lane there is. Nearly everything
          # a helios benchmark measures lives in the cross-platform
          # kernel, so performance is single-architecture by decision,
          # and x86-64 KVM is the one GitHub-hosted surface that can
          # measure it: the Arm runners publish no /dev/kvm at all
          # (`-accel kvm` there fails with "Could not access KVM kernel
          # module", probe run 33944339758) and the macOS lane that used
          # to stand in for them ran `"accel":["tcg"]` behind an HVF
          # label (#118). aarch64 lanes in CI are functional smokes.
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build \
            qemu-system-x86 ovmf \
            iproute2 nftables dnsmasq-base
          # GitHub's x86-64 runners expose /dev/kvm; the inspector picks
          # the accelerator by capability, this only fixes permissions.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          git clone --depth 1 --branch v11.x-binary \
            https://github.com/limine-bootloader/limine "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helios
          key: bench-${{ matrix.name }}
      - name: Install inferno flamegraph renderer
        run: cargo install inferno --locked
      # The guest image, its bootfs and the inspector are built here so
      # the benchmark step below times guests rather than a cold cargo
      # cache. Every class the driver then runs boots what this leaves in
      # the target directory (#153), and the compile's cost is this
      # step's own line in the job summary.
      # Every x86-64 release build is built against the kernel profile
      # the newest kernel-profile.yml run on the default branch uploaded
      # (docs/pgo.md, #226, #313); the inspector refuses to build one
      # without it rather than producing a plain kernel wearing a PGO
      # label, so the fetch comes before the build. Reading the artifact
      # is what the job's `actions: read` is for.
      - name: Fetch the kernel profile
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release -p helios-cli -- profile-fetch
      - name: Build the Helios guest and inspector
        working-directory: helios
        env:
          HELIOS_WORKLOAD_BENCH_ARCH: ${{ matrix.helios-arch }}
          HELIOS_WORKLOAD_BENCH_BUILD_ONLY: "1"
        run: tools/wasi-apps/workload-bench.sh
      - uses: astral-sh/setup-uv@v6
      - name: Export benchmark function symbols
        working-directory: helios/tools/bench
        run: uv run helios-bench symbols --root ../.. --out-dir "$GITHUB_WORKSPACE/kernel-symbols"
      - name: Preserve benchmark function symbols before boot
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}-kernel-symbols
          path: kernel-symbols/**/*.symbols.json
          if-no-files-found: error
          retention-days: 7
      - name: Provision the multi-queue tap network backend
        if: matrix.net-backend == 'tap'
        working-directory: helios
        run: |
          # QEMU's vhost-net backend opens /dev/vhost-net itself; udev
          # creates that node root:kvm mode 0660 and the runner account is
          # not in the group, so without this QEMU warns four times, fails
          # its tap client and asserts before the guest boots. The lane's
          # pipeline status used to hide exactly that.
          sudo modprobe vhost_net
          sudo chmod 0666 /dev/vhost-net
          ls -l /dev/vhost-net
          ./target/release/helios-inspector vm net-setup \
            --net-backend tap \
            --net-ifname "${HELIOS_NET_IFNAME}" \
            --net-bridge "${HELIOS_NET_BRIDGE}" \
            --net-dhcp
      - name: Run Helios workload benchmarks
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: ${{ matrix.boot-timeout }}
          HELIOS_WORKLOAD_BENCH_VM_MEMORY: ${{ matrix.vm-memory }}
          HELIOS_WORKLOAD_BENCH_NET_BACKEND: ${{ matrix.net-backend }}
          HELIOS_WORKLOAD_BENCH_RUNTIME_DIR: ${{ env.BENCH_RUNTIME_DIR }}
          HELIOS_WORKLOAD_BENCH_ACCEL: ${{ matrix.accel }}
          # No capture here. The network workloads are the only ones
          # whose failure leaves nothing behind to read, but QEMU's
          # netfilters attach to a single-queue netdev only, and this
          # lane's whole point is a multi-queue tap — so a capture and
          # this lane are mutually exclusive.
          # `HELIOS_WORKLOAD_BENCH_NET_PCAP=1` takes one on any
          # single-queue run; see docs/networking.md.
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          if [ "${{ matrix.net-backend }}" = tap ]; then
            export HELIOS_WORKLOAD_BENCH_NET_IFNAME="${HELIOS_NET_IFNAME}"
            export HELIOS_WORKLOAD_BENCH_NET_BRIDGE="${HELIOS_NET_BRIDGE}"
            # One queue pair per host processor: the point of the tap
            # backend is that the guest driver can actually fan out.
            HELIOS_WORKLOAD_BENCH_NET_QUEUES="$(nproc)"
            export HELIOS_WORKLOAD_BENCH_NET_QUEUES
          fi
          # The inspector echoes the guest's boot lines on stderr; the
          # log is kept so the next step can record which virtio-net
          # features this lane actually negotiated.
          #
          # The side budget is what bounds the lane: the per-class cap is
          # what one healthy class may take, and this is what all of them
          # together may take, inside the job's own 75 minutes.
          python3 tools/wasi-apps/linux-gap-bench.py \
            --arch ${{ matrix.helios-arch }} \
            --skip-linux \
            --allow-busy-host \
            --helios-timeout-seconds 9000 \
            --helios-side-timeout-seconds 3000 \
            --helios-skip-build \
            --helios-host-http-host ${{ matrix.net-host }} \
            --helios-host-tcp-host ${{ matrix.net-host }} \
            --out-dir target/perf-baselines/ci-${{ matrix.name }} \
            ${{ matrix.workloads }} 2>&1 | tee "${NET_BOOT_LOG}"
      - name: Report negotiated virtio-net features
        if: always()
        working-directory: helios
        run: |
          {
            printf '### virtio-net feature set (%s)\n\n' '${{ matrix.name }}'
            printf 'Backend: `%s`' '${{ matrix.net-backend }}'
            if [ '${{ matrix.net-backend }}' = user ]; then
              printf ' — single queue, no checksum or TSO offload; not\n'
              printf 'comparable with the multi-queue tap lanes.'
            fi
            printf '\n\n```\n'
            # One runtime subdirectory per workload class, so the logs
            # are a level down from the directory the lane names.
            find "${BENCH_RUNTIME_DIR}" -name '*.log' -print0 2>/dev/null \
              | xargs -0 grep -h -e 'virtio-net online' -e 'virtio features negotiated' \
                  "${NET_BOOT_LOG}" 2>/dev/null | sort -u \
              || printf 'no virtio-net bring-up line was logged\n'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      # The same raw-capture check the smoke lanes run: the benchmark
      # boots the guest twice per workload class, so this lane is where
      # a rare byte loss on the debug serial shows up first (#102).
      - name: Check the raw debug serial captures
        if: always()
        working-directory: helios
        run: python3 tools/debug-serial-report.py "${BENCH_RUNTIME_DIR}"
      # A bring-up failure leaves the inspector's one-line error and
      # nothing else in the step log; the guest console and QEMU's own
      # stderr live in the runtime directory, so collect it exactly as
      # the smoke lanes do.
      - name: Upload the inspector runtime directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}-runtime
          path: |
            bench-runtime/**/*.log
            bench-runtime/**/*.pcap
            helios-bench-boot.log
            kernel-symbols/**/*.symbols.json
          if-no-files-found: warn
      - name: Remove the tap network backend
        if: always() && matrix.net-backend == 'tap'
        working-directory: helios
        run: |
          ./target/release/helios-inspector vm net-teardown \
            --net-backend tap \
            --net-ifname "${HELIOS_NET_IFNAME}" \
            --net-bridge "${HELIOS_NET_BRIDGE}"
      - name: Summarize results
        if: always()
        working-directory: helios
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          out_dir = Path("target/perf-baselines/ci-${{ matrix.name }}")
          print("### Helios workload medians (${{ matrix.name }})\n")
          print("| workload | class | median (ms) | iterations (ms) |")
          print("| --- | --- | --- | --- |")
          for jsonl in sorted(out_dir.glob("helios*.jsonl")):
              for line in jsonl.read_text().splitlines():
                  row = json.loads(line)
                  if row.get("type") != "summary":
                      continue
                  iters = ", ".join(f"{float(v):.3f}" for v in row.get("elapsed_ms", []))
                  print(
                      f"| {row['workload']} | {row['class']} "
                      f"| {float(row['median_elapsed_ms']):.3f} | {iters} |"
                  )
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-baselines-${{ matrix.name }}
          path: helios/target/perf-baselines/ci-${{ matrix.name }}/**
          if-no-files-found: warn
