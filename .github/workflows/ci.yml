name: CI

on:
  pull_request:
    # `ready_for_review` runs the full selection a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a new head cancels: a pull request's `synchronize` supersedes
  # the older run. `opened`, `reopened` and `ready_for_review` carry the
  # head a run is already building and queue behind it, because a run
  # cancelled before its matrix expands leaves a failed check named after
  # the unexpanded expression that nothing replaces. A `dev` push runs to
  # completion: merges land faster than a run finishes, and a completed
  # `dev` run is the only writer of the host lanes' caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which lanes a change needs, so a lane runs only when the
  # change touches what it reads (#687). `.github/ci-lanes.json` maps each
  # lane to the surfaces it reads; the filters below name those surfaces
  # by path. A lane also runs on `shared` and `pin` changes unless it is
  # `exclusive`, which reads only its own surfaces. A skipped lane
  # reports as skipped, which a required check counts as passing; no
  # ruleset on `dev` requires a lane of this workflow. A dispatch and a
  # push to `dev` run every lane. A draft pull request is not a merge
  # candidate and runs `lint-fmt` alone; marking it ready for review runs
  # the rest.
  #
  # It also says whether the change touches what fixes the kernel
  # profile's format (the profdata header check, the guest's raw writer)
  # or the compiler that reads it. The profile every x86-64 lane spends is
  # the newest one collected on dev, by the compiler dev pinned then; a
  # pull request that moves any of these cannot read it, and dev cannot
  # collect another until the pull request merges (#731). Only a pull
  # request is asked: a push to dev is what `kernel-profile.yml` collects
  # on, and a dispatch has no change to speak of.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # JSON array of the lane names to run.
      lanes: ${{ steps.select.outputs.lanes }}
      # JSON array of {name, command, rust-cache} for the legs of the
      # `checks` matrix.
      checks: ${{ steps.select.outputs.checks }}
      # `true` when the change moves the kernel profile's format or the
      # compiler that reads it; `kernel-profile` then collects this run's.
      profile_format: ${{ steps.filter.outputs.profile_format || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci-lanes.json
          sparse-checkout-cone-mode: false
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # `shared` is everything no narrower surface claims, so a new
          # top-level path runs every lane until a surface claims it;
          # `docs/**` and Markdown run none, except the Wasmtime pin
          # the CI checkout reads.
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - '**'
              - '!aarch64/**'
              - '!riscv/**'
              - '!x86/**'
              - '!hosted/**'
              - '!inspector/**'
              - '!inspector-protocol/**'
              - '!cli/**'
              - '!compiler-support/**'
              - '!profdata/**'
              - '!workspace-root/**'
              - '!programs/**'
              - '!api/**'
              - '!api-macro/**'
              - '!compiler-plugin/**'
              - '!docs/**'
              - '!**/*.md'
            pin:
              - 'docs/wasmtime.md'
            aarch64:
              - 'aarch64/**'
            riscv:
              - 'riscv/**'
            x86:
              - 'x86/**'
            hosted:
              - 'hosted/**'
            host_tools:
              - 'inspector/**'
              - 'inspector-protocol/**'
              - 'cli/**'
              - 'compiler-support/**'
              - 'profdata/**'
              - 'workspace-root/**'
            programs:
              - 'programs/**'
              - 'api/**'
              - 'api-macro/**'
              - 'compiler-plugin/**'
            # The 3D path the Venus lane boots, and the lane's own
            # definition. It overlaps `shared` rather than carving out of
            # it: a change here still runs every other lane `shared` does.
            gpu:
              - 'hal/src/display.rs'
              - 'hal/src/display/**'
              - 'hal/src/device.rs'
              - 'virtio/src/gpu.rs'
              - 'virtio/src/gpu/**'
              - 'kernel/src/gpu/**'
              - 'kernel/src/display/**'
              - 'kernel/src/wasmtime_adapter/component_host/service/gpu.rs'
              - 'kernel/src/wasmtime_adapter/component_host/service/display.rs'
              - 'x86/src/memory_type.rs'
              - 'wit/deps/helios-system/gpu.wit'
              - 'wit/deps/helios-system/display.wit'
              - 'programs/gpu-test/**'
              - 'inspector/**'
              - '.github/qemu/x86_64-venus-configure.args'
              - '.github/qemu/virglrenderer-meson.args'
              - '.github/ci-lanes.json'
              - '.github/workflows/ci.yml'
            profile_format:
              - 'rust-toolchain.toml'
              - 'profdata/**'
              - 'kernel/src/profiling/**'
      - id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes || 'null' }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          set -euo pipefail
          lanes="$(jq -c --argjson changed "${CHANGED}" --argjson draft "${DRAFT}" '
            to_entries
            | map(select($changed == null
                or (.value.surfaces + (if .value.exclusive then [] else ["shared", "pin"] end)
                    | any(. as $surface | $changed | index($surface)))))
            | map(.key)
            | if $draft then map(select(. == "lint-fmt")) else . end' .github/ci-lanes.json)"
          checks="$(jq -c --argjson lanes "${lanes}" '
            to_entries
            | map(select(.value.command and (.key as $name | $lanes | index($name))))
            | map({name: .key, command: .value.command,
                   "rust-cache": (.value["rust-cache"] // false)})' .github/ci-lanes.json)"
          echo "lanes=${lanes}" >> "$GITHUB_OUTPUT"
          echo "checks=${checks}" >> "$GITHUB_OUTPUT"
          echo "${lanes}"

  # The collection a `profile_format` change spends in place of dev's
  # profile: the same workflow `bench-suite.yml` calls, on this run's
  # commit, uploaded under the stable artifact name. `smoke-x86-64` is its
  # only reader, so a run that skips that lane (a draft) skips this too.
  kernel-profile:
    name: kernel-profile
    needs: changes
    if: needs.changes.outputs.profile_format == 'true' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64')
    permissions:
      contents: read
    uses: ./.github/workflows/kernel-profile.yml

  checks:
    name: ${{ matrix.name }}
    needs: changes
    # An empty matrix is an error, not a skip.
    if: needs.changes.outputs.checks != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The legs, their commands and whether each keeps a Rust cache
        # live in `.github/ci-lanes.json` beside the surfaces each reads;
        # `changes` keeps the ones this change needs. `just lint` runs its
        # gates back to back locally; CI splits them so a lint failure
        # names the surface it came from.
        include: ${{ fromJSON(needs.changes.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build erofs-utils
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,cargo-deny,nextest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      # Only the host lanes nearly every pull request runs keep a Rust
      # cache, and only a `dev` push writes it: the repository's cache
      # quota holds these four and nothing more, and a pull request's
      # entry is restorable from its own merge ref alone. Every other
      # lane, workflow and action builds cold.
      - uses: Swatinem/rust-cache@v2
        if: matrix.rust-cache
        with:
          workspaces: helios
          key: ${{ matrix.name }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      - uses: astral-sh/setup-uv@v6
      - name: ${{ matrix.name }}
        working-directory: helios
        run: ${{ matrix.command }}

  # Every smoke step that boots a guest carries a bound of its own, so a
  # guest that hangs fails that step and the lane uploads its runtime
  # directories; the job's limit would cancel it hours later with nothing
  # kept (#795). A bound is several times the longest its step took over
  # 40 green runs: 30 minutes where the step also builds the kernel image
  # or compiles in the guest (614 s at most), 5 minutes for every other
  # boot (64 s at most).
  smoke-riscv64:
    name: smoke-riscv64
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'smoke-riscv64')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build erofs-utils \
            qemu-system-misc opensbi
          qemu-system-riscv64 --version
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      - name: Boot riscv64 guest
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        env:
          # GitHub runners expose no riscv64 accelerator, so the guest runs
          # under TCG and needs an emulation-sized bring-up budget.
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/boot"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-smoke.out | tee "$runtime/inspector.log"
          cat boot-smoke.out
          grep -Fqx ok boot-smoke.out
      # Verified boot needs no TPM (#602): the payload the boot above
      # ran, with one byte of its signed body inverted, is refused on
      # its signature before anything in it is read.
      - name: Refuse a tampered boot payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime/tampered"
          mkdir -p "$runtime"
          "$check" tamper target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-bootfs \
            "$runtime/helios-bootfs"
          if ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs "$runtime/helios-bootfs" \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' > "$runtime/shell.out" 2> "$runtime/inspector.log"; then
            echo 'the inspector booted a payload whose signature does not match'
            exit 1
          fi
          cat "$runtime/inspector.log"
          "$check" refused "$runtime/debug-serial.log"
      - name: Seed the wall clock from the goldfish RTC
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # The kernel reads the goldfish RTC before any program runs, so
          # a guest asking wasi:clocks/wall-clock must agree with the
          # runner's own clock. Comparing the two is what distinguishes a
          # seeded clock from one that only counts uptime; the kernel's
          # own seed line stays in the trace history on this backend,
          # which does not mirror kernel logs to the serial.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/wall-clock"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program date \
            --no-compiler-plugin \
            shell -c '/bin/date' > wall-clock-smoke.out 2>&1
          cat wall-clock-smoke.out
          guest_epoch="$(sed -n 's/^unix_seconds=\([0-9][0-9]*\).*$/\1/p' wall-clock-smoke.out | tail -n 1)"
          host_epoch="$(date +%s)"
          skew=$(( guest_epoch > host_epoch ? guest_epoch - host_epoch : host_epoch - guest_epoch ))
          echo "guest ${guest_epoch}, host ${host_epoch}, skew ${skew}s"
          test "${skew}" -le 60
      - name: Run the coreutils applets through dash
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # coreutils is one multicall WASIX module published under several
          # bootfs names, so every applet is launched by bare name and dash
          # resolves it through PATH. Issue #39 died here on riscv64.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/coreutils"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program mkdir --boot-program cat \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c 'mkdir /d; echo coreutils:ok > /d/f; cat /d/f; ls /' \
            2>&1 > coreutils-smoke.out | tee "$runtime/inspector.log"
          cat coreutils-smoke.out
          grep -Fqx coreutils:ok coreutils-smoke.out
          grep -Fqx bin coreutils-smoke.out
      - name: Mount an EROFS disk from init
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          # A read-only disk with a serial other than the scratch disk's
          # is a mount source. The session runs init, which mounts it from
          # /etc/fstab; mounts belong to a process tree, so the reads run
          # from /etc/rc, under init (#511).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/erofs"
          mkdir -p "$runtime/tree/docs" "$runtime/bootfs/etc" "$runtime/bootfs/image"
          printf 'erofs:ok\n' > "$runtime/tree/hello.txt"
          printf '中文\n' > "$runtime/tree/docs/中文.txt"
          printf '日本語\n' > "$runtime/tree/docs/日本語.txt"
          printf '한국어\n' > "$runtime/tree/docs/한국어.txt"
          mkfs.erofs -zlz4 "$runtime/image.erofs" "$runtime/tree"
          printf 'helios init: erofs smoke\n' > "$runtime/bootfs/init.txt"
          printf 'disk:erofs-smoke /image ro\n' > "$runtime/bootfs/etc/fstab"
          printf 'cat /image/hello.txt\nls /image/docs\n' > "$runtime/bootfs/etc/rc"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs-root "$runtime/bootfs" \
            --disk "$runtime/image.erofs,serial=erofs-smoke,readonly" \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program cat --boot-program init \
            --no-compiler-plugin \
            shell -c init 2>&1 > erofs-smoke.out | tee "$runtime/inspector.log"
          cat erofs-smoke.out
          grep -Fqx 'helios init: mounted disk:erofs-smoke at /image' erofs-smoke.out
          grep -Fqx 'helios init: listing /image' erofs-smoke.out
          grep -Fqx 'dir docs' erofs-smoke.out
          grep -Fqx 'file hello.txt' erofs-smoke.out
          # The rest is /etc/rc: cat and ls, children of init, reading
          # through the mount.
          grep -Fqx 'erofs:ok' erofs-smoke.out
          grep -Fqx '中文.txt' erofs-smoke.out
          grep -Fqx '日本語.txt' erofs-smoke.out
          grep -Fqx '한국어.txt' erofs-smoke.out
      - name: Run CPython
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Same interpreter and one-liner as tools/wasi-apps/smoke.sh, so the
          # riscv64 lane covers the stdlib import path that issue #39 broke.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/cpython"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program python3 \
            --no-compiler-plugin \
            shell -c 'python3 -c "import json, pathlib; print(json.dumps({\"ok\": pathlib.PurePosixPath(\"/a\").name}, separators=(\",\",\":\")))"' \
            2>&1 > cpython-smoke.out | tee "$runtime/inspector.log"
          cat cpython-smoke.out
          grep -Fqx '{"ok":"a"}' cpython-smoke.out
      - name: Trap an out-of-bounds guest load
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program oob-load \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - uses: ./helios/.github/actions/vhost-vsock
      - name: Boot riscv64 guest with the inspector RPC on vsock
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --rpc-transport vsock \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' > vsock-smoke.out
          cat vsock-smoke.out
          grep -Fqx ok vsock-smoke.out
      - name: Boot riscv64 guest on two NUMA nodes
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Every other boot describes one node, so nothing else reads
          # `numa-node-id` or the distance map from a real device tree
          # (#516). The kernel prints the layout it placed memory and
          # processors by; the log carries colour escapes, hence `-a`.
          # The RPC rides vsock here because the boot UART carries the
          # kernel log only when the debugger does not need the line.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/numa"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg --smp 4 --numa-nodes 2 --numa-distance 20 \
            --rpc-transport vsock \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-numa.out | tee "$runtime/inspector.log"
          cat boot-numa.out
          grep -Fqx ok boot-numa.out
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      - name: Fetch over virtio-net with curl
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # curl speaks wasi:http, which the kernel forwards to the
          # http-client plugin, so both boot programs are required. curl is
          # invoked by bare name so dash resolves it through PATH and execs
          # it with argv[0] == "curl", which is the shape that regressed in
          # issue #35; tools/wasi-apps/smoke.sh covers the bootfs-path shape.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/curl"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program curl --boot-program http-client --no-compiler-plugin \
            shell -c 'curl http://detectportal.firefox.com/success.txt' 2>&1 > curl-smoke.out | tee "$runtime/inspector.log"
          cat curl-smoke.out
          grep -Fqx success curl-smoke.out
      - name: Fetch over TLS with curl
        shell: bash
        working-directory: helios
        env:
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The same fetch through the plugin's TLS transport: the
          # handshake, the certificate chain against the compiled-in
          # roots, and the validity window against the wall clock the
          # platform RTC seeded. The same boot then fetches from three
          # origins that each present a bad certificate (expired, issued
          # for another name, self-signed), which must each fail as
          # `tls-certificate-error`; the trailing `true` keeps the last
          # failed fetch's exit status from failing the step before the
          # log is read.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/curl-https"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch riscv64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program curl --boot-program http-client --no-compiler-plugin \
            shell -c 'curl https://detectportal.firefox.com/success.txt; curl https://expired.badssl.com/; curl https://wrong.host.badssl.com/; curl https://self-signed.badssl.com/; true' 2>&1 > curl-https-smoke.out | tee "$runtime/inspector.log"
          cat curl-https-smoke.out
          grep -Fqx success curl-https-smoke.out
          # curl prints the error code through its Debug form
          # (`ErrorCode::TlsCertificateError`), on whichever stream the
          # inspector relays the guest's stderr to.
          test "$(cat curl-https-smoke.out "$runtime/inspector.log" | grep -Fc 'http request failed: ErrorCode::TlsCertificateError')" -eq 3
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-riscv64-runtime
          # The guest console and QEMU's own stdout, stderr and -d logs.
          # GitHub drops a step's log outright when it cannot render it, so
          # what a failing smoke needs has to leave the job as a file rather
          # than as console output. The disk images the runtime directory
          # also holds are deliberately not collected.
          path: |
            smoke-runtime/*/*.log
          if-no-files-found: warn
          retention-days: 7
      # Each boot above rebuilds the bootfs for its own `--boot-program`
      # selection, so what the target directory holds now is the last
      # boot's subset. A build with no selection is the superset every
      # workload class boots from; the kernel is not relinked.
      - name: Build the full guest image
        id: guest-image
        # A lane that failed before it built the inspector has nothing
        # to build an image with.
        if: always() && hashFiles('helios/target/release/helios-inspector') != ''
        working-directory: helios
        run: ./target/release/helios-inspector vm --arch riscv64 --release build
      # The image a `--no-build` boot needs on another host, laid out as
      # the paths under `target/` the inspector reads: unpacked into
      # `target/`, it is the whole installation (docs/boot.md). The
      # manifest and the key files are not part of it: nothing on the
      # `--no-build` path reads them, and the manifest records this
      # runner's absolute paths. The root key pair is generated per
      # build, so the signing key the kernel carries belongs to this
      # image alone.
      - name: Upload the guest image
        if: always() && steps.guest-image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-guest-riscv64
          path: |
            helios/target/riscv64gc-unknown-none-elf/kernel-release/helios
            helios/target/kernel-prebuild/riscv64gc-unknown-none-elf/kernel-release/helios-bootfs
          if-no-files-found: error
          retention-days: 90

  # A native Arm Linux runner under multi-threaded TCG. This lane is a
  # functional check, not a performance surface: `ubuntu-24.04-arm`
  # publishes no `/dev/kvm` at all — `-accel kvm` there fails with
  # "Could not access KVM kernel module" (probe run 33944339758) — so
  # both boots below ask for `--accel tcg` on purpose. The inspector
  # requires a profile's native accelerator when nobody names one, so a
  # lane that means to measure the emulator has to say so (#118).
  #
  # The QEMU 8.2 that Ubuntu 24.04 ships asserts in its emulated GICv3
  # CPU interface under multi-threaded TCG
  # (`gicv3_cpuif_update: assertion failed: (qemu_mutex_iothread_locked())`,
  # issue #85), and no archive that is safe to mix into noble carries a
  # newer one: the cloud archive ships OpenStack only, noble-backports
  # has no emulator at all, and a package from a later Ubuntu or from
  # Debian trixie would pull its own glibc onto the runner. So the lane
  # builds a pinned upstream release once and caches the install prefix
  # by version. The tarball also installs the EDK2 blobs the aarch64
  # boot needs, which the inspector finds through the prefix.
  smoke-aarch64:
    name: smoke-aarch64
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'smoke-aarch64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      QEMU_VERSION: "11.1.1"
      # download.qemu.org publishes a detached signature but no checksum
      # file; this is the digest of the tarball that signature covers.
      QEMU_SHA256: 079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482
      QEMU_PREFIX: ${{ github.workspace }}/qemu-install
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build erofs-utils \
            python3-venv pkg-config flex bison \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev zlib1g-dev \
            swtpm
          swtpm --version
          # Recorded rather than required: the accelerator is picked by
          # capability and today's Arm runners publish no KVM node.
          ls -la /dev/kvm || echo 'no /dev/kvm on this runner'
      - name: Restore the pinned QEMU install prefix
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QEMU_PREFIX }}
          # The configure flags are part of the key: a build made with
          # other flags is a different install (#687).
          key: qemu-${{ env.QEMU_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/.github/qemu/aarch64-configure.args') }}
      - name: Build the pinned QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="qemu-${QEMU_VERSION}.tar.xz"
          curl -fsSLO "https://download.qemu.org/${tarball}"
          echo "${QEMU_SHA256}  ${tarball}" | sha256sum -c -
          tar xf "${tarball}"
          cd "qemu-${QEMU_VERSION}"
          # aarch64-softmmu is the only target this lane boots, and the
          # inspector's default network backend is `user`, which has been
          # external libslirp since 8.0.
          # The flags live in a file the cache key hashes.
          mapfile -t flags < "${GITHUB_WORKSPACE}/helios/.github/qemu/aarch64-configure.args"
          ./configure --prefix="${QEMU_PREFIX}" "${flags[@]}"
          ninja -C build install
      - name: Put the pinned QEMU on PATH
        run: |
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
      - name: Record the QEMU in use
        run: |
          command -v qemu-system-aarch64
          qemu-system-aarch64 --version
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          # Limine publishes its prebuilt bootloader as a release asset;
          # the digest is the one of v12.9.6's `limine-binary.tar.gz`.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector
      # The aarch64 backend takes its whole platform description from
      # the firmware, and QEMU's `virt` publishes a device tree or ACPI
      # tables but never both. Both descriptions have to boot, so the
      # same smoke runs twice and each mode asserts which one the kernel
      # actually used.
      - name: Boot aarch64 guest from the device tree
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/device-tree"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-dt.out | tee "$runtime/inspector.log"
          cat boot-dt.out
          grep -Fqx ok boot-dt.out
          grep -F 'platform described by device-tree' "$runtime/inspector.log"
          # Every processor installed the machine's key and enabled
          # return-address signing before the kernel ran anything else.
          grep -F 'return-address signing enabled on every processor' "$runtime/inspector.log"
          # The `virt` board's PL061 GPIO controller is hardware the
          # kernel has no driver for, so discovery offers it to a
          # user-mode one. This asserts the whole path from the device
          # tree to a published grant, which is the only thing that
          # proves the walk still sees a real device rather than
          # nothing.
          grep -F 'device grant published device=pl061@9030000' "$runtime/inspector.log"
      - name: Boot aarch64 guest on two NUMA nodes from the device tree
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Every other boot describes one node, so nothing else reads
          # `numa-node-id` or the distance map from a real device tree
          # (#516). The kernel prints the layout it placed memory and
          # processors by; the log carries colour escapes, hence `-a`.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/numa"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G \
            --accel tcg --smp 4 --numa-nodes 2 --numa-distance 20 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-numa.out | tee "$runtime/inspector.log"
          cat boot-numa.out
          grep -Fqx ok boot-numa.out
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      - name: Boot aarch64 guest on two NUMA nodes from ACPI
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # The same machine as the boot above, described by the SRAT, the
          # SLIT and the MADT's GICC entries instead of `numa-node-id` and
          # the distance map (#516).
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/acpi-numa"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg --smp 4 --numa-nodes 2 --numa-distance 20 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-acpi-numa.out | tee "$runtime/inspector.log"
          cat boot-acpi-numa.out
          grep -Fqx ok boot-acpi-numa.out
          grep -F 'platform described by acpi' "$runtime/inspector.log"
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      # The same guest under the same accelerator as the device-tree
      # boot above, described the other way. ACPI carries no counterpart
      # to `/chosen/rng-seed`, so this boot's seed comes from the CPU's
      # FEAT_RNG and the bring-up read of the virtio-rng device rather
      # than from the firmware.
      - name: Boot aarch64 guest from ACPI
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/acpi"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-acpi.out | tee "$runtime/inspector.log"
          cat boot-acpi.out
          grep -Fqx ok boot-acpi.out
          grep -F 'platform described by acpi' "$runtime/inspector.log"
          grep -F 'return-address signing enabled on every processor' "$runtime/inspector.log"
          # The ACPI walk looks for virtio transports by hardware id and
          # names nothing else, so an ACPI-described machine publishes
          # no grants. Asserting the absence keeps that a stated fact
          # rather than something that quietly starts or stops being
          # true.
          ! grep -qF 'device grant published' "$runtime/inspector.log"
      - name: Mount an EROFS disk from init
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          # A read-only disk with a serial other than the scratch disk's
          # is a mount source. The session runs init, which mounts it from
          # /etc/fstab; mounts belong to a process tree, so the reads run
          # from /etc/rc, under init (#511).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/erofs"
          mkdir -p "$runtime/tree/docs" "$runtime/bootfs/etc" "$runtime/bootfs/image"
          printf 'erofs:ok\n' > "$runtime/tree/hello.txt"
          printf '中文\n' > "$runtime/tree/docs/中文.txt"
          printf '日本語\n' > "$runtime/tree/docs/日本語.txt"
          printf '한국어\n' > "$runtime/tree/docs/한국어.txt"
          mkfs.erofs -zlz4 "$runtime/image.erofs" "$runtime/tree"
          printf 'helios init: erofs smoke\n' > "$runtime/bootfs/init.txt"
          printf 'disk:erofs-smoke /image ro\n' > "$runtime/bootfs/etc/fstab"
          printf 'cat /image/hello.txt\nls /image/docs\n' > "$runtime/bootfs/etc/rc"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs-root "$runtime/bootfs" \
            --disk "$runtime/image.erofs,serial=erofs-smoke,readonly" \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program cat --boot-program init \
            --no-compiler-plugin \
            shell -c init 2>&1 > erofs-smoke.out | tee "$runtime/inspector.log"
          cat erofs-smoke.out
          grep -Fqx 'helios init: mounted disk:erofs-smoke at /image' erofs-smoke.out
          grep -Fqx 'helios init: listing /image' erofs-smoke.out
          grep -Fqx 'dir docs' erofs-smoke.out
          grep -Fqx 'file hello.txt' erofs-smoke.out
          # The rest is /etc/rc: cat and ls, children of init, reading
          # through the mount.
          grep -Fqx 'erofs:ok' erofs-smoke.out
          grep -Fqx '中文.txt' erofs-smoke.out
          grep -Fqx '日本語.txt' erofs-smoke.out
          grep -Fqx '한국어.txt' erofs-smoke.out
      - name: Take a wasm trap on aarch64
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G \
            --accel tcg \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program oob-load \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - uses: ./helios/.github/actions/swtpm
      # Measured boot (#602): the kernel's signing seed is sealed in the
      # TPM to the boot chain. The ACPI description is the boot whose
      # measured input repeats (PCR 9 holds the kernel and the payload),
      # so the retention check runs here: two boots of one payload on
      # one TPM state directory, the first provisions and seals a seed,
      # the second unseals it, and the public half of the derived key is
      # the same. The second boot is handed the payload the first booted
      # by path, so both measure the same bytes whether or not a rebuild
      # reproduces them. Whether it also skips recompiling needs the
      # persisted cwasm of #579.
      - name: Keep the kernel signing key across measured ACPI boots
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          state="$RUNNER_TEMP/tpm-state-aarch64-acpi"
          rm -rf "$state"
          boot() {
            runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/$1"
            shift
            mkdir -p "$runtime"
            ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G --acpi \
              --accel tcg --tpm swtpm --tpm-state "$state" \
              --runtime-dir "$runtime" --keep-runtime-dir "$@" \
              shell -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
            grep -Fqx ok "$runtime/shell.out"
          }
          boot acpi-retention-1 --boot-program dash --boot-program debugger --no-compiler-plugin
          cp target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-bootfs \
            "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained"
          first="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-retention-1/debug-serial.log" provisioned-and-sealed empty)"
          boot acpi-retention-2 --bootfs "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            --boot-program dash --boot-program debugger --no-compiler-plugin
          second="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-retention-2/debug-serial.log" unsealed none)"
          echo "signer: first boot $first, second boot $second"
          test "$first" = "$second"
          echo "$first" > "$RUNNER_TEMP/tpm-signer-aarch64-acpi"
      # One byte of the payload's signed body is inverted. The kernel
      # refuses the payload on its signature before it measures or
      # parses it, so the guest never reaches the debugger and the
      # inspector reports the panic.
      - name: Refuse a tampered boot payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-tampered"
          mkdir -p "$runtime"
          "$check" tamper "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            "$runtime/helios-bootfs"
          if ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg --tpm swtpm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs "$runtime/helios-bootfs" \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' > "$runtime/shell.out" 2> "$runtime/inspector.log"; then
            echo 'the inspector booted a payload whose signature does not match'
            exit 1
          fi
          cat "$runtime/inspector.log"
          "$check" refused "$runtime/debug-serial.log"
      # A different boot program set is a different payload, signed by
      # the same build root, so it verifies and PCR 9 differs. The TPM
      # state the retention step left is sealed to the old measurement:
      # it is reported as changed state, a new seed replaces it, and the
      # key is not the one of the two boots before.
      - name: Reseal the kernel signing key after a changed payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/acpi-changed"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G --acpi \
            --accel tcg --tpm swtpm --tpm-state "$RUNNER_TEMP/tpm-state-aarch64-acpi" \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program date \
            --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
          grep -Fqx ok "$runtime/shell.out"
          changed="$("$check" settled "$runtime/debug-serial.log" provisioned-and-sealed state-changed)"
          retained="$(cat "$RUNNER_TEMP/tpm-signer-aarch64-acpi")"
          echo "signer: retained $retained, after the change $changed"
          test "$changed" != "$retained"
      # Booted from the device tree, QEMU's `virt` writes a fresh
      # `/chosen/rng-seed` and `kaslr-seed` into the blob at every boot,
      # and Limine measures the blob into PCR 9, so PCR 9 never repeats
      # (#602). A sealed seed cannot survive a reboot here, and that is
      # the sealing policy working: the second boot of one payload on
      # one TPM state directory must report changed state, provision a
      # new seed, and derive a different key, where the ACPI boots
      # above retain it.
      - name: Detect changed state across measured device-tree boots
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          state="$RUNNER_TEMP/tpm-state-aarch64-dt"
          rm -rf "$state"
          boot() {
            runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/$1"
            mkdir -p "$runtime"
            ./target/release/helios-inspector vm --arch aarch64 --release --memory 2G \
              --accel tcg --tpm swtpm --tpm-state "$state" \
              --runtime-dir "$runtime" --keep-runtime-dir \
              --boot-program dash --boot-program debugger --no-compiler-plugin \
              shell -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
            grep -Fqx ok "$runtime/shell.out"
            grep -F 'platform described by device-tree' "$runtime/inspector.log"
          }
          boot dt-1
          first="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/dt-1/debug-serial.log" provisioned-and-sealed empty)"
          boot dt-2
          second="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/dt-2/debug-serial.log" provisioned-and-sealed state-changed)"
          echo "signer: first boot $first, second boot $second"
          test "$first" != "$second"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-aarch64-runtime
          path: |
            smoke-runtime/*/*.log
            smoke-runtime-measured/*/*.log
          if-no-files-found: warn
          retention-days: 7
      # Each boot above rebuilds the bootfs for its own `--boot-program`
      # selection, so what the target directory holds now is the last
      # boot's subset. A build with no selection is the superset every
      # workload class boots from; the kernel is not relinked.
      - name: Build the full guest image
        id: guest-image
        # A lane that failed before it built the inspector has nothing
        # to build an image with.
        if: always() && hashFiles('helios/target/release/helios-inspector') != ''
        working-directory: helios
        run: ./target/release/helios-inspector vm --arch aarch64 --release build
      # The image a `--no-build` boot needs on another host, laid out as
      # the paths under `target/` the inspector reads: unpacked into
      # `target/`, it is the whole installation (docs/boot.md). The
      # manifest and the key files are not part of it: nothing on the
      # `--no-build` path reads them, and the manifest records this
      # runner's absolute paths. The root key pair is generated per
      # build, so the signing key the kernel carries belongs to this
      # image alone. The compiler plugin's core module rides along: the
      # bench's Linux + Wasmtime column runs the build the bootfs
      # precompiled (tools/bench/native/build.sh, compiler-host/).
      - name: Upload the guest image
        if: always() && steps.guest-image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-guest-aarch64
          path: |
            helios/target/aarch64-unknown-none/kernel-release/helios
            helios/target/kernel-prebuild/aarch64-unknown-none/kernel-release/helios-bootfs
            helios/target/kernel-prebuild/aarch64-unknown-none/kernel-release/compiler_plugin.wasm
          if-no-files-found: error
          retention-days: 90
      # A kernel built with HELIOS_CFI_SELF_TEST corrupts a signed return
      # address once every processor has started, and the guest has to panic
      # with a control-flow violation. It is a debug build of its own kernel
      # and bootfs, so it runs after the steps that take the release image
      # from the target directory. The test runs under `cargo test`, not
      # nextest: its slow-timeout would kill the build it makes. The pinned
      # QEMU is already on PATH, which is where the inspector looks for
      # `qemu-system-aarch64`.
      - name: Refuse a corrupted return address
        timeout-minutes: 60
        shell: bash
        working-directory: helios
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
        run: |
          cargo test -p helios-inspector -- --ignored --nocapture --exact \
            vm::tests::cfi_self_test_panics_aarch64

  smoke-x86-64:
    name: smoke-x86-64
    needs: [changes, kernel-profile]
    if: ${{ !cancelled() && needs.changes.result == 'success' && contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64') && (needs.kernel-profile.result == 'success' || needs.kernel-profile.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 180
    env:
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      # Every boot below names `--accel kvm`. The inspector no longer
      # falls through to the emulator on its own, and this runner does
      # publish /dev/kvm (probe run 33944339758), so a run that lost it
      # should say so rather than quietly take twenty times as long.
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build erofs-utils \
            qemu-system-x86 ovmf swtpm
          qemu-system-x86_64 --version
          swtpm --version
          # The inspector picks the accelerator by capability; this only
          # fixes the permissions on the node when the runner has one.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
          fi
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          # Limine publishes its prebuilt bootloader as a release asset;
          # the digest is the one of v12.9.6's `limine-binary.tar.gz`.
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/limine-binary.tar.gz" \
            https://github.com/limine-bootloader/limine/releases/download/v12.9.6/limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  $RUNNER_TEMP/limine-binary.tar.gz" \
            | sha256sum --check -
          mkdir -p "$GITHUB_WORKSPACE/limine"
          tar -xzf "$RUNNER_TEMP/limine-binary.tar.gz" --strip-components=1 \
            -C "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - name: Build inspector
        working-directory: helios
        run: cargo build --release -p helios-inspector -p helios-desktop-text-check
      # Every x86-64 release build is built against the kernel profile
      # the newest kernel-profile.yml run on the default branch uploaded
      # (docs/pgo.md, #226, #313); the inspector refuses to build one
      # without it rather than producing a plain kernel wearing a PGO
      # label, so the fetch comes before the build. Reading the artifact
      # is what the job's `actions: read` is for.
      - name: Fetch the kernel profile
        if: needs.changes.outputs.profile_format != 'true'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release -p helios-cli -- profile-fetch
      # A change to what fixes the profile's format or to the compiler
      # that reads it leaves the default branch's profile unreadable to
      # this tree, and nothing on that branch can replace it before the
      # change merges (#731). The run collects its own, and the lane
      # spends that one: the same fetch, naming the run.
      - name: Fetch this run's kernel profile
        if: needs.changes.outputs.profile_format == 'true'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release -p helios-cli -- profile-fetch --run "${{ github.run_id }}"
      - name: Boot x86-64 guest
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        run: |
          # Nothing covered x86-64 booting a guest, so a regression in
          # its PCI bring-up or its memory split reached `dev` twice
          # before anyone ran it by hand: issue #74. This step is the
          # thing that would have caught both.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/boot"
          mkdir -p "$runtime"
          # The three virtio-input functions ride on this boot rather
          # than on one of their own: input bring-up is part of PCI
          # bring-up, and a machine with a desktop presents keyboard,
          # pointer and tablet at once, which is also what proves the
          # backend installs every function it finds rather than the
          # first (#301). This is the only x86-64 KVM boot that carries
          # them; the developer machines have no KVM.
          # Two `--disk` images ride on it too: every disk with a serial
          # other than the scratch disk's is a mount source, and
          # `helios-data` stays the scratch disk beside them (#510).
          truncate -s 64M "$runtime/src-a.img" "$runtime/src-b.img"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --qemu-arg -device --qemu-arg virtio-keyboard-pci \
            --qemu-arg -device --qemu-arg virtio-mouse-pci \
            --qemu-arg -device --qemu-arg virtio-tablet-pci \
            --disk "$runtime/src-a.img,serial=src-a" \
            --disk "$runtime/src-b.img,serial=src-b,readonly" \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-smoke.out | tee "$runtime/inspector.log"
          cat boot-smoke.out
          grep -Fqx ok boot-smoke.out
          # The kernel writes its boot lines to the one UART the guest
          # has, and `debug-serial.log` is the host's raw copy of it.
          grep -F 'virtio-input online' "$runtime/debug-serial.log"
          test "$(grep -cF 'virtio-input online' "$runtime/debug-serial.log")" -eq 3
          # The log carries the console's colour escapes, so these read
          # it as text (`-a`) to print the matching line.
          grep -aF 'mount source online serial="src-a"' "$runtime/debug-serial.log" | grep -aF 'read_only=false'
          grep -aF 'mount source online serial="src-b"' "$runtime/debug-serial.log" | grep -aF 'read_only=true'
          grep -aF 'block device identified as the kernel scratch disk serial="helios-data"' "$runtime/debug-serial.log"
          # The inspector attaches `vmgenid` on the x86 profile, so the
          # guest has to have found its generation ID window (#572).
          grep -aF 'vmgenid online' "$runtime/debug-serial.log"
      - name: Boot x86-64 guest on two NUMA nodes
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Every other boot describes one node, so nothing else reads the
          # SRAT or the SLIT from real ACPI tables (#516). `-smp
          # 4,sockets=2,cores=2` gives processors 0-3 APIC ids 0-3 in MADT
          # order, and `-numa node,cpus=` puts 0-1 on node 0 and 2-3 on
          # node 1. The kernel prints the layout it placed memory and
          # processors by; the log carries colour escapes, hence `-a`.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/numa"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm --smp 4 --numa-nodes 2 --numa-distance 20 \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > boot-numa.out | tee "$runtime/inspector.log"
          cat boot-numa.out
          grep -Fqx ok boot-numa.out
          grep -aF 'NUMA topology nodes=2 distances=10,20;20,10' "$runtime/debug-serial.log"
          grep -aF 'NUMA node node=0' "$runtime/debug-serial.log" | grep -aF 'processors=0-1'
          grep -aF 'NUMA node node=1' "$runtime/debug-serial.log" | grep -aF 'processors=2-3'
      - uses: ./helios/.github/actions/swtpm
      # The kernel's signing seed is sealed in the TPM to the measured
      # boot chain (#602). Two boots of one payload on one TPM state
      # directory: the first provisions and seals a seed, the second
      # unseals it, and the public half of the key the seed derives is
      # the same in both. The second boot is handed the payload the
      # first one booted by path, so the two measure the same bytes
      # whether or not a rebuild reproduces them. Whether the second
      # boot also skips recompiling needs the persisted cwasm of #579.
      - name: Keep the kernel signing key across measured boots
        timeout-minutes: 15
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          state="$RUNNER_TEMP/tpm-state-x86-64"
          rm -rf "$state"
          boot() {
            runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/$1"
            shift
            mkdir -p "$runtime"
            ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
              --accel kvm --tpm swtpm --tpm-state "$state" \
              --runtime-dir "$runtime" --keep-runtime-dir "$@" \
              shell -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
            grep -Fqx ok "$runtime/shell.out"
          }
          boot retention-1 --boot-program dash --boot-program debugger --no-compiler-plugin
          cp target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-bootfs \
            "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained"
          first="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/retention-1/debug-serial.log" provisioned-and-sealed empty)"
          boot retention-2 --bootfs "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            --boot-program dash --boot-program debugger --no-compiler-plugin
          second="$("$check" settled "$GITHUB_WORKSPACE/smoke-runtime-measured/retention-2/debug-serial.log" unsealed none)"
          echo "signer: first boot $first, second boot $second"
          test "$first" = "$second"
          echo "$first" > "$RUNNER_TEMP/tpm-signer-x86-64"
      # One byte of the payload's signed body is inverted. The kernel
      # refuses the payload on its signature before it measures or
      # parses it, so the guest never reaches the debugger and the
      # inspector reports the panic.
      - name: Refuse a tampered boot payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/tampered"
          mkdir -p "$runtime"
          "$check" tamper "$GITHUB_WORKSPACE/smoke-runtime-measured/helios-bootfs.retained" \
            "$runtime/helios-bootfs"
          if ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm --tpm swtpm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs "$runtime/helios-bootfs" \
            --boot-program dash --boot-program debugger --no-compiler-plugin \
            shell -c 'echo ok' > "$runtime/shell.out" 2> "$runtime/inspector.log"; then
            echo 'the inspector booted a payload whose signature does not match'
            exit 1
          fi
          cat "$runtime/inspector.log"
          "$check" refused "$runtime/debug-serial.log"
      # A different boot program set is a different payload, signed by
      # the same build root, so it verifies and PCR 9 differs. The TPM
      # state the retention step left is sealed to the old measurement:
      # it is reported as changed state, a new seed replaces it, and the
      # key is not the one of the two boots before.
      - name: Reseal the kernel signing key after a changed payload
        timeout-minutes: 10
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          check=tools/measured-boot-check.sh
          runtime="$GITHUB_WORKSPACE/smoke-runtime-measured/changed"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm --tpm swtpm --tpm-state "$RUNNER_TEMP/tpm-state-x86-64" \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program date \
            --no-compiler-plugin \
            shell -c 'echo ok' 2>&1 > "$runtime/shell.out" | tee "$runtime/inspector.log"
          grep -Fqx ok "$runtime/shell.out"
          changed="$("$check" settled "$runtime/debug-serial.log" provisioned-and-sealed state-changed)"
          retained="$(cat "$RUNNER_TEMP/tpm-signer-x86-64")"
          echo "signer: retained $retained, after the change $changed"
          test "$changed" != "$retained"
      - name: Run the coreutils applets through dash
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # coreutils is one multicall WASIX module published under
          # several bootfs names, so every applet is launched by bare
          # name and dash resolves it through PATH.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/coreutils"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program mkdir --boot-program cat \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c 'mkdir /d; echo coreutils:ok > /d/f; cat /d/f; ls /' \
            2>&1 > coreutils-smoke.out | tee "$runtime/inspector.log"
          cat coreutils-smoke.out
          grep -Fqx coreutils:ok coreutils-smoke.out
          grep -Fqx bin coreutils-smoke.out
      - name: Mount an EROFS disk from init
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          set -o pipefail
          # A read-only disk with a serial other than the scratch disk's
          # is a mount source. The session runs init, which mounts it from
          # /etc/fstab; mounts belong to a process tree, so the reads run
          # from /etc/rc, under init (#511).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/erofs"
          mkdir -p "$runtime/tree/docs" "$runtime/bootfs/etc" "$runtime/bootfs/image"
          printf 'erofs:ok\n' > "$runtime/tree/hello.txt"
          printf '中文\n' > "$runtime/tree/docs/中文.txt"
          printf '日本語\n' > "$runtime/tree/docs/日本語.txt"
          printf '한국어\n' > "$runtime/tree/docs/한국어.txt"
          mkfs.erofs -zlz4 "$runtime/image.erofs" "$runtime/tree"
          printf 'helios init: erofs smoke\n' > "$runtime/bootfs/init.txt"
          printf 'disk:erofs-smoke /image ro\n' > "$runtime/bootfs/etc/fstab"
          printf 'cat /image/hello.txt\nls /image/docs\n' > "$runtime/bootfs/etc/rc"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --bootfs-root "$runtime/bootfs" \
            --disk "$runtime/image.erofs,serial=erofs-smoke,readonly" \
            --boot-program dash --boot-program debugger \
            --boot-program ls --boot-program cat --boot-program init \
            --no-compiler-plugin \
            shell -c init 2>&1 > erofs-smoke.out | tee "$runtime/inspector.log"
          cat erofs-smoke.out
          grep -Fqx 'helios init: mounted disk:erofs-smoke at /image' erofs-smoke.out
          grep -Fqx 'helios init: listing /image' erofs-smoke.out
          grep -Fqx 'dir docs' erofs-smoke.out
          grep -Fqx 'file hello.txt' erofs-smoke.out
          # The rest is /etc/rc: cat and ls, children of init, reading
          # through the mount.
          grep -Fqx 'erofs:ok' erofs-smoke.out
          grep -Fqx '中文.txt' erofs-smoke.out
          grep -Fqx '日本語.txt' erofs-smoke.out
          grep -Fqx '한국어.txt' erofs-smoke.out
      - name: Run CPython twice and record its launch phases
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Issue #311's fixed per-launch cost lives somewhere in the
          # exec path; on aarch64/HVF the trace cleared the bootfs read,
          # the signature check and 9p, leaving the x86-specific memory
          # path unmeasured (#352). This boot is the KVM measurement:
          # --enable-target opens helios_kernel::exec::phases on the
          # kernel console filter and each launch emits one line — every
          # phase's offset from rpc-arrival, written once after the
          # guest ran so the UART cost lands outside every interval.
          # Two python3 launches give one cold and one warm split, and
          # debug-serial.log is the artifact the orchestrator reads the
          # split from. docs/benchmarks.md lists the fields.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/cpython-phases"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program python3 \
            --no-compiler-plugin \
            --enable-target helios_kernel::exec::phases \
            shell -c 'python3 -c "print(1)"; python3 -c "print(2)"' \
            2>&1 > cpython-phases-smoke.out | tee "$runtime/inspector.log"
          cat cpython-phases-smoke.out
          # debug-serial.log carries console escape bytes, so grep reads
          # it as text with -a. `program` on a launch line is the
          # launched program's name — the RPC path or the argv name or
          # the resolved guest path, all of which name python3 here.
          lines="$(grep -a 'phase_count' "$runtime/debug-serial.log" | grep -a 'python3')"
          echo "$lines"
          # Each launch emits exactly one line carrying phase_count.
          test "$(echo "$lines" | grep -ac 'phase_count')" -eq 2
          # The cold launch paid a deserialize; the warm launch's
          # deserialize cache hit means it never reached that phase, so
          # the field is absent from its line.
          cold="$(echo "$lines" | grep -a 'cache_hit=false')"
          warm="$(echo "$lines" | grep -a 'cache_hit=true')"
          echo "$cold" | grep -aq 'deserialize_ns'
          test "$(echo "$warm" | grep -ac 'deserialize_ns')" -eq 0
          echo "$warm" | grep -aq 'cache_hit=true'
      - name: Compile a guest with the in-kernel compiler plugin
        timeout-minutes: 30
        shell: bash
        working-directory: helios
        run: |
          # The step that #74 actually died in. The plugin's shared memory
          # is the largest single reservation the user address space is
          # asked for, and its declared maximum is still capped by what the
          # user pool could serve, so this remains the step that proves the
          # pool answers a plugin-sized request.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/compiler"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            shell --trace-log "$runtime/guest-tracing.log" -c 'echo compiler:ok' \
            2>&1 > compiler-smoke.out | tee "$runtime/inspector.log"
          cat compiler-smoke.out
          grep -Fqx compiler:ok compiler-smoke.out
      - name: Trap an out-of-bounds guest load
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A wasm32 guest cannot form an address outside the 4 GiB the
          # kernel reserves behind its linear memory, which is why Cranelift
          # emits no bounds check for its loads: an access past the pages the
          # guest has grown into lands on reserved memory and faults. That
          # fault has to reach the runtime's trap handler and come back out as
          # a wasm trap that kills one instance. `oob-load` prints its marker,
          # then makes the access; the shell printing afterwards is what says
          # the fault did not take the machine with it (#59).
          runtime="$GITHUB_WORKSPACE/smoke-runtime/oob-load"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program oob-load \
            --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/oob-load; echo guest-alive' \
            2>&1 > oob-load-smoke.out | tee "$runtime/inspector.log"
          cat oob-load-smoke.out
          cat "$runtime/guest-tracing.log"
          grep -Fqx oob-load:before-fault oob-load-smoke.out
          grep -Fqx guest-alive oob-load-smoke.out
          ! grep -Fq 'Kernel panic' oob-load-smoke.out
      - name: Refuse a guest-written cwasm whose signature does not verify
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # Only bytes that came from the boot payload load without a
          # signature check; a cwasm a guest writes must verify against
          # the kernel's trusted roots (#483). The build root signs the
          # payload image once, not each cwasm in it (#602), so a bootfs
          # cwasm carries no signature of its own and a guest's copy of
          # it inherits nothing. CPython copies one to /copy unchanged
          # and to /forged with one byte flipped: the original runs from
          # the boot payload, and both copies must be refused, so the
          # program's marker line prints exactly once. A missing file is
          # refused too, so the writes must report success.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/unsigned-cwasm"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger --boot-program python3 \
            --boot-program wasix-atomic-wait-timeout --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c 'python3 -c "import pathlib; b = pathlib.Path(\"/bin/wasix-atomic-wait-timeout\").read_bytes(); pathlib.Path(\"/copy\").write_bytes(b); f = bytearray(b); f[-13] ^= 1; pathlib.Path(\"/forged\").write_bytes(bytes(f))" && echo cwasm:written; /bin/wasix-atomic-wait-timeout && echo original:ran; /copy && echo copy:ran || echo copy:refused; /forged && echo forged:ran || echo forged:refused' \
            2>&1 > unsigned-cwasm-smoke.out | tee "$runtime/inspector.log"
          cat unsigned-cwasm-smoke.out
          grep -Fqx cwasm:written unsigned-cwasm-smoke.out
          grep -Fqx original:ran unsigned-cwasm-smoke.out
          grep -Fqx copy:refused unsigned-cwasm-smoke.out
          test "$(grep -cF copy:ran unsigned-cwasm-smoke.out)" -eq 0
          grep -Fqx forged:refused unsigned-cwasm-smoke.out
          test "$(grep -cF forged:ran unsigned-cwasm-smoke.out)" -eq 0
          test "$(grep -cFx atomic-wait-timeout:ok unsigned-cwasm-smoke.out)" -eq 1
          ! grep -Fq 'Kernel panic' unsigned-cwasm-smoke.out
      - name: Time out a memory.atomic.wait nobody notifies
        # A wait that is never cut short hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A timed wait on bare metal used to re-park for its whole
          # timeout after every wake and never return TimedOut (#455).
          # The guest waits 20 ms with no notifier and prints its marker
          # only for result 2 after at least that long; a regression hangs
          # and the lane's timeout names it.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/atomic-wait-timeout"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program wasix-atomic-wait-timeout --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-atomic-wait-timeout' \
            2>&1 > atomic-wait-timeout-smoke.out | tee "$runtime/inspector.log"
          cat atomic-wait-timeout-smoke.out
          grep -Fqx atomic-wait-timeout:ok atomic-wait-timeout-smoke.out
          ! grep -Fq 'Kernel panic' atomic-wait-timeout-smoke.out
      - name: Kill a thread parked in memory.atomic.wait
        # A wait that is never cut short hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A thread parked forever in memory.atomic.wait32 used to panic
          # the kernel when a kill or signal dropped its call (#445). The
          # parent signals it and prints its marker only after thread_join
          # returns, which needs the parked fiber to have unwound.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/atomic-wait-kill"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program wasix-atomic-wait-kill --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-atomic-wait-kill' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx atomic-wait-kill:ok "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: End a process whose threads are still running
        # A process that leaves its threads running hangs here, not in a
        # later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A WASIX process whose main returned left its threads running,
          # and each kept a clone of the session's stdout open, so the
          # shell reading it never returned (#462). Main returns with one
          # thread parked forever in memory.atomic.wait32 and one spinning
          # in pure wasm; the process must end with main's status, and
          # the shell's echo after it proves its output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/orphan-threads"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program wasix-orphan-threads --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-orphan-threads; echo orphan-threads:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx orphan-threads:ok "$runtime/guest.log"
          grep -Fqx orphan-threads:exit=0 "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: End a process from proc_exit on a spawned thread
        # A thread's proc_exit that ends only that thread leaves main
        # parked and hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # POSIX exit ends the whole process from any thread (#469).
          # Main parks forever in memory.atomic.wait32 and a spawned
          # thread calls proc_exit(7): the process must end with 7, and
          # the shell's echo after it proves its output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/thread-proc-exit"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program wasix-thread-proc-exit --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-thread-proc-exit; echo thread-proc-exit:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx thread-proc-exit:spawned "$runtime/guest.log"
          grep -Fqx thread-proc-exit:parking "$runtime/guest.log"
          grep -Fqx thread-proc-exit:exiting "$runtime/guest.log"
          grep -Fqx thread-proc-exit:exit=7 "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: Replace a process from proc_exec on a spawned thread
        # An exec on a thread that is dropped leaves main parked and
        # hangs here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # POSIX execve replaces the whole process from any thread
          # (#470). Main parks forever in memory.atomic.wait32 and a
          # spawned thread execs /bin/dash -c 'echo thread-exec:replaced':
          # every thread must end, the replacement must run in the
          # process and exit 0, and the shell's echo after it proves the
          # output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/thread-exec"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program wasix-thread-exec --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-thread-exec; echo thread-exec:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx thread-exec:spawned "$runtime/guest.log"
          grep -Fqx thread-exec:parking "$runtime/guest.log"
          grep -Fqx thread-exec:exec "$runtime/guest.log"
          grep -Fqx thread-exec:replaced "$runtime/guest.log"
          grep -Fqx thread-exec:exit=0 "$runtime/guest.log"
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: End a process from a trap on a spawned thread
        # A trap that ends only its thread leaves main parked and hangs
        # here, not in a later step.
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A trap ends the whole process from any thread, as SIGSEGV and
          # SIGILL do (#473). The first run is the control: main traps on
          # its own. In the second, main parks forever in
          # memory.atomic.wait32 and a spawned thread traps: the process
          # must end with the control's status, and the shell's echo
          # after it proves its output closed.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/thread-trap"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program wasix-thread-trap --no-compiler-plugin \
            shell --trace-log "$runtime/guest-tracing.log" \
            -c '/bin/wasix-thread-trap main; echo main-trap:exit=$?; /bin/wasix-thread-trap; echo thread-trap:exit=$?' \
            2>&1 > "$runtime/guest.log" | tee "$runtime/inspector.log"
          cat "$runtime/guest.log"
          grep -Fqx thread-trap:main-trapping "$runtime/guest.log"
          grep -Fqx thread-trap:spawned "$runtime/guest.log"
          grep -Fqx thread-trap:parking "$runtime/guest.log"
          grep -Fqx thread-trap:trapping "$runtime/guest.log"
          main_status="$(sed -n 's/^main-trap:exit=//p' "$runtime/guest.log")"
          thread_status="$(sed -n 's/^thread-trap:exit=//p' "$runtime/guest.log")"
          printf 'main trap exit=%s, thread trap exit=%s\n' "$main_status" "$thread_status"
          # 0 is no trap at all, and 1 is the module's own setup failure.
          [[ -n "$main_status" && "$main_status" != 0 && "$main_status" != 1 ]]
          [[ "$thread_status" == "$main_status" ]]
          ! grep -Fq 'Kernel panic' "$runtime/guest.log"
      - name: Fetch over virtio-net with curl
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The counterpart of smoke-riscv64's curl step, and what #86
          # died in twice over: nothing here drove the NIC, because the
          # balloon service had wedged the bootstrap processor's
          # executor, and once it did drive the NIC the transmit queue's
          # MSI-X message landed on a vector the routing table did not
          # know. Both are x86-only, and neither is visible from any
          # step that does not move a packet.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/curl"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program curl --boot-program http-client --no-compiler-plugin \
            shell -c 'curl http://detectportal.firefox.com/success.txt' \
            2>&1 > curl-smoke.out | tee "$runtime/inspector.log"
          cat curl-smoke.out
          grep -Fqx success curl-smoke.out
      - name: Fetch over TLS with curl
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The counterpart of smoke-riscv64's TLS step, under KVM, with the
          # same three bad-certificate fetches.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/curl-https"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --boot-program dash --boot-program debugger \
            --boot-program curl --boot-program http-client --no-compiler-plugin \
            shell -c 'curl https://detectportal.firefox.com/success.txt; curl https://expired.badssl.com/; curl https://wrong.host.badssl.com/; curl https://self-signed.badssl.com/; true' \
            2>&1 > curl-https-smoke.out | tee "$runtime/inspector.log"
          cat curl-https-smoke.out
          grep -Fqx success curl-https-smoke.out
          # curl prints the error code through its Debug form
          # (`ErrorCode::TlsCertificateError`), on whichever stream the
          # inspector relays the guest's stderr to.
          test "$(cat curl-https-smoke.out "$runtime/inspector.log" | grep -Fc 'http request failed: ErrorCode::TlsCertificateError')" -eq 3
      - name: Draw on the display and capture the scanout
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # The desktop devices on the PCI machine: a virtio-GPU that
          # replaces q35's default VGA adapter, the keyboard and both
          # pointers, and a virtio-sound device playing into the `wav`
          # sink, which needs no host audio at all. The capture is taken
          # with no host display backend — the whole point of reading the
          # scanout through QMP is that a headless runner sees what a
          # window would have shown (docs/desktop.md).
          #
          # `display-test` claims the display through
          # `helios:system/display`, fills a surface with a gradient whose
          # colour at every pixel is a function of that pixel's position,
          # and keeps presenting while the captures are taken. The
          # gradient is what makes the capture evidence: a display
          # nothing ever attached a resource to also
          # produces a valid PNG, and only the pixels tell the two apart.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none --audiodev "wav:$runtime/desktop.wav" \
            --qemu-trace trace:virtio_gpu_update_cursor \
            --qemu-trace-log "$runtime/qemu-trace.log" \
            --boot-program dash --boot-program debugger \
            --boot-program display-test --boot-program gpu-test \
            --no-compiler-plugin \
            screendump \
              --run /bin/dash --run-arg -c \
              --run-arg "gpu-test; display-test --seconds 20 & wait" \
              --settle-seconds 2 "$captures/drawn.png" "$captures/settled.png" \
            2>&1 | tee "$runtime/inspector.log"
          # A PPM under a .png name would be an artifact nothing opens,
          # so the format QEMU was asked for is the format checked.
          for capture in "$captures/drawn.png" "$captures/settled.png"; do
            test -s "$capture"
            file "$capture" | grep -Fq 'PNG image data'
          done
          # The guest's own account of what it drew, and the picture's.
          grep -Fq 'display-test:claimed' "$runtime/inspector.log"
          # `gpu-test` claims the 3D engine through `helios:system/gpu`.
          # The smoke lane's QEMU offers a 2D device only, so its answer
          # is `3d=none` — on the guest's own line and on the kernel's
          # boot line, which is where "this machine has no 3D" is read
          # off rather than deduced from a missing message. The feature
          # tail says what a 2D device negotiates: none of them.
          grep -Fq 'gpu-test:3d=none' "$runtime/inspector.log"
          grep -Fq '3d=none blob=off context-init=off uuid=off' "$runtime/debug-serial.log"
          grep -Eq 'display-test:surface scanout=0 width=[0-9]+ height=[0-9]+' \
            "$runtime/inspector.log"
          grep -Fq 'display-test:cursor-set' "$runtime/inspector.log"
          grep -Eq 'display-test:frame sequence=[0-9]+ cursor=[0-9]+,[0-9]+' \
            "$runtime/inspector.log"
          # The sound device `--audiodev` attached to this boot. The
          # driver's own line is what says the device answered its three
          # bring-up queries, and this is the only lane whose guest has a
          # sound device at all (#305). The kernel writes its boot lines
          # to the one UART the guest has, and `debug-serial.log` is the
          # host's raw copy of it.
          grep -Eq 'virtio-snd online transport=pci streams=[0-9]+ jacks=[0-9]+ rates=[0-9]+\.\.[0-9]+ formats=[A-Z0-9,]+' \
            "$runtime/debug-serial.log"
          python3 tools/desktop/check-gradient.py \
            "$captures/drawn.png" "$captures/settled.png"
          # The pointer is a plane the capture does not hold, so the device's
          # own trace of every cursor command is checked against the
          # positions the guest says it moved to.
          python3 tools/desktop/check-cursor.py \
            "$runtime/inspector.log" "$runtime/qemu-trace.log"
      - name: Read the desktop's input devices from the guest
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A second boot rather than a second action on the first: one
          # session runs one action, and weakening either half — a
          # capture taken while nothing is drawing, or an input script
          # sent before anything claimed the devices — would leave the
          # evidence unattributable.
          #
          # `input-test` claims every device `helios:system/input` lists
          # and prints each event it is handed, `SYN_REPORT` included.
          # The script then presses one key and moves the tablet, so the
          # guest's own output is what says the events crossed the whole
          # path: virtio ring, kernel drain, bounded queue, p3 stream.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-input"
          mkdir -p "$runtime"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --boot-program dash --boot-program debugger \
            --boot-program input-test --no-compiler-plugin \
            input tools/desktop/input-probe.input \
              --run /bin/input-test --run-arg --seconds --run-arg 12 \
              --settle-seconds 3 --interval-ms 200 \
            2>&1 | tee "$runtime/inspector.log"
          # The guest claimed the devices before it read anything.
          grep -Eq 'input-test:claimed device=QEMU Virtio (Keyboard|Tablet)' \
            "$runtime/inspector.log"
          grep -Eq 'input-test:reading devices=[1-9]' "$runtime/inspector.log"
          # The four evdev events the script produced, in the order the
          # guest was handed them. `awk` rather than four greps: what is
          # being asserted is the order, and each `grep` on its own would
          # pass on a capture that had them backwards.
          grep -F 'input-test:event' "$runtime/inspector.log" \
            | awk '
                /kind=EV_KEY/                  && stage == 0 { stage = 1; next }
                /kind=EV_SYN code=SYN_REPORT/  && stage == 1 { stage = 2; next }
                /kind=EV_ABS code=ABS_X/       && stage == 2 { stage = 3; next }
                /kind=EV_ABS code=ABS_Y/       && stage == 3 { stage = 4; next }
                /kind=EV_SYN code=SYN_REPORT/  && stage == 4 { stage = 5; exit }
                END {
                  if (stage != 5) {
                    print "input-test reported no EV_KEY, EV_SYN, EV_ABS x, EV_ABS y, " \
                          "EV_SYN in that order (reached stage " stage ")" > "/dev/stderr"
                    exit 1
                  }
                }'
          # A report lost is a reader that did not keep up, and this run
          # injects a handful of events into a queue 64 deep.
          ! grep -Fq 'input report was dropped' "$runtime/inspector.log"
      - name: Boot the desktop with the compositor and type at its terminal
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A third desktop boot, for the third claim. The two above
          # prove the services — a display a guest can draw on, input a
          # guest can read — and this one proves the program that owns
          # both at once: the compositor claims the display and every
          # input device, draws a desktop, runs the shell in a terminal
          # on it, and puts what is typed at it on the screen.
          #
          # No `--no-compiler-plugin` here, unlike the two boots above:
          # the compositor spawns `/bin/dash`, which is a raw wasm the
          # in-kernel compiler has to turn into an artifact first.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-compositor"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --qemu-trace trace:virtio_gpu_update_cursor \
            --qemu-trace-log "$runtime/qemu-trace.log" \
            --boot-program dash --boot-program debugger \
            --boot-program compositor --boot-program surface-test \
            screendump \
              --run /bin/surface-test --run-wait-seconds 60 \
              --input tools/desktop/desktop-probe.input --input-interval-ms 150 \
              --settle-seconds 20 "$captures/compositor.png" \
            2>&1 | tee "$runtime/inspector.log"
          # A PPM under a .png name would be an artifact nothing opens.
          test -s "$captures/compositor.png"
          file "$captures/compositor.png" | grep -Fq 'PNG image data'
          # The compositor's own account: it claimed the display, laid a
          # terminal out on it, and presented a frame per keystroke.
          grep -Eq 'compositor:online scanout=0 width=[0-9]+ height=[0-9]+' \
            "$runtime/inspector.log"
          grep -Eq 'compositor:frame sequence=[0-9]+ regions=[0-9]+ cursor=[0-9]+,[0-9]+' \
            "$runtime/inspector.log"
          # The first client window the desktop ever saw: surface-test
          # asked for one, drew a frame and gave it back, and each of its
          # three lines is evidence that part of the surface path ran —
          # a missing one is a call the compositor did not survive.
          grep -Fq 'surface-test:created' "$runtime/inspector.log"
          grep -Fq 'surface-test:committed' "$runtime/inspector.log"
          grep -Fq 'surface-test:destroyed' "$runtime/inspector.log"
          # Where the terminal put its top-left cell, read from the
          # guest's own line rather than assumed: the layout is the
          # desktop's business, and a check that guessed it would be
          # checking a different rectangle.
          origin="$(sed -n 's/.*compositor:terminal .*origin=\([0-9]*,[0-9]*\).*/\1/p' \
            "$runtime/inspector.log" | head -1)"
          test -n "$origin"
          # The pixels of the two rows the script produced, against the
          # same glyphs rendered by the same font crate the compositor
          # draws with — `tools/desktop/check-text` links the modules the
          # compositor draws with (`programs/compositor/render`), so the
          # check and the desktop cannot disagree about what an `h`
          # looks like. A capture that is a
          # valid PNG of a desktop showing nothing passes every check
          # above and fails this one.
          #
          # `helios$ ` is the prompt the compositor gave the shell it
          # spawned, `echo hello` is what the terminal echoed as the
          # script typed it, and `hello` on the row below is what the
          # shell printed back — which together is the whole path:
          # keyboard, focus, terminal, shell, terminal, scanout.
          ./target/release/check-desktop-text \
            --capture "$captures/compositor.png" --origin "$origin" \
            --expect '0,0=helios$ echo hello' --expect '1,0=hello'
          # The pointer is a plane the capture does not hold, so the
          # device's own trace of every cursor command is checked against
          # the positions the guest says it moved to.
          python3 tools/desktop/check-cursor.py \
            "$runtime/inspector.log" "$runtime/qemu-trace.log"
      - name: Kill the compositor and watch the supervisor bring it back
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A restart is one machine before and after, so this is one
          # boot with three captures: the desktop, the machine with the
          # compositor gone, and the desktop the supervisor put back.
          # `--kill-instance` stops the instance once the first capture
          # is taken and `--kill-settle-ms` is the interval the second is
          # meant to catch, before the rebuild has finished.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-restart"
          captures="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$captures"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --desktop --display none \
            --boot-program dash --boot-program debugger \
            --boot-program compositor \
            screendump \
              --input tools/desktop/desktop-probe.input --input-interval-ms 150 \
              --settle-seconds 20 \
              --kill-instance compositor-plugin --kill-settle-ms 200 \
              "$captures/restart-before.png" \
              "$captures/restart-blank.png" \
              "$captures/restart-after.png" \
            2>&1 | tee "$runtime/inspector.log"
          for capture in restart-before restart-blank restart-after; do
            test -s "$captures/$capture.png"
            file "$captures/$capture.png" | grep -Fq 'PNG image data'
          done
          # The kill reached the instance, and the supervisor said so.
          grep -Fq 'reason=Operator' "$runtime/inspector.log"
          grep -Fq 'the compositor died; rebuilding it' "$runtime/inspector.log"
          # Two `compositor online` lines: the one that booted, and the
          # one the supervisor built after the kill. One would mean
          # nothing died.
          online="$(grep -c 'compositor online instance=' "$runtime/inspector.log")"
          test "$online" -ge 2
          origin="$(sed -n 's/.*compositor:terminal .*origin=\([0-9]*,[0-9]*\).*/\1/p' \
            "$runtime/inspector.log" | head -1)"
          test -n "$origin"
          # Before: the desktop, with the command and its output on it.
          ./target/release/check-desktop-text \
            --capture "$captures/restart-before.png" --origin "$origin" \
            --expect '0,0=helios$ echo hello' --expect '1,0=hello'
          # In between: nothing. The display is the compositor's claim
          # and the kernel released it with the instance that held it, so
          # there is no frame buffer for the engine to scan out.
          if ./target/release/check-desktop-text \
              --capture "$captures/restart-blank.png" --origin "$origin" \
              --expect '0,0=helios$ echo hello'; then
            echo "the scanout still showed the dead compositor's terminal" >&2
            exit 1
          fi
          # After: a desktop again, with a fresh terminal rather than the
          # dead one's — a restarted compositor rebuilds the desktop, it
          # does not recover the old one's scrollback.
          ./target/release/check-desktop-text \
            --capture "$captures/restart-after.png" --origin "$origin" \
            --expect '0,0=helios$ '
      - name: Play a tone through the desktop's sound device
        timeout-minutes: 5
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          # A boot of its own, for the same reason the input probe has
          # one: this session's whole job is the recording, and a capture
          # taken while `display-test` was also driving the machine could
          # not be attributed to the audio path.
          #
          # `--audiodev` alone attaches the virtio-sound device — the
          # desktop's display and input adapters are not needed to make a
          # sound — and the `wav` backend writes what the device played
          # to a file, so a headless runner with no sound card at all
          # produces the same recording a speaker would have made
          # (docs/desktop.md).
          #
          # `audio-test` claims the playback stream through
          # `helios:system/audio`, negotiates 48 kHz stereo S16 and
          # writes two seconds of a 440 Hz sine into it. The tone is the
          # evidence: a device nothing ever sent a period to also leaves
          # a valid WAV header behind, and only the samples tell the two
          # apart.
          runtime="$GITHUB_WORKSPACE/smoke-runtime/desktop-audio"
          evidence="$GITHUB_WORKSPACE/desktop-scanout"
          mkdir -p "$runtime" "$evidence"
          ./target/release/helios-inspector vm --arch x86-64 --release --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --audiodev "wav:$evidence/tone.wav" \
            --boot-program dash --boot-program debugger \
            --boot-program audio-test --no-compiler-plugin \
            shell -c '/bin/audio-test --seconds 2' \
            2>&1 > audio-smoke.out | tee "$runtime/inspector.log"
          cat audio-smoke.out
          # The driver answered its bring-up queries before any of this.
          grep -Eq 'virtio-snd online transport=pci streams=[0-9]+ jacks=[0-9]+ rates=[0-9]+\.\.[0-9]+ formats=[A-Z0-9,]+' \
            "$runtime/debug-serial.log"
          # The kernel's own account: the service came up, and the stream
          # was configured with what the guest asked for rather than with
          # the nearest thing the device offered.
          grep -Fq 'audio service online' "$runtime/debug-serial.log"
          grep -Eq 'playback stream negotiated .*rate=48000 channels=2' \
            "$runtime/debug-serial.log"
          # The guest's own account, in the order the path runs in.
          grep -Eq 'audio-test:claimed stream=[0-9]+' audio-smoke.out
          grep -Fq 'audio-test:negotiated rate=48000 channels=2 format=S16' \
            audio-smoke.out
          grep -Eq 'audio-test:wrote bytes=384000 frames=96000' audio-smoke.out
          # An underrun is a period the kernel had nothing to play, and
          # nothing substitutes silence for it (#306), so a run that
          # reports one produced a recording with a hole in it.
          grep -Eq 'audio-test:done latency-bytes=[0-9]+ xruns=0' audio-smoke.out
          # And the recording itself: two seconds of one partial at the
          # frequency the guest generated.
          test -s "$evidence/tone.wav"
          file "$evidence/tone.wav" | grep -Fq 'WAVE audio'
          python3 tools/desktop/check-tone.py "$evidence/tone.wav" \
            --hz 440 --seconds 2
      - name: Upload the desktop scanout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-desktop
          # The pictures, the recording, and nothing else. A kernel image
          # carries the signing material the guest verifies its own
          # artifacts with and never leaves the job.
          path: |
            desktop-scanout/*.png
            desktop-scanout/*.wav
          if-no-files-found: warn
          retention-days: 7
      # The host keeps its own copy of the debug serial, written by the
      # QEMU chardev before the inspector frames a byte of it. A stage
      # marker broken in that copy was lost inside QEMU's transmit
      # path; one broken only in the framed output above was lost by
      # the reader (#102). x86-64 is the lane where either happens,
      # because its console mirror streams the whole boot log through
      # COM1 exactly while the application processors come online.
      - name: Check the raw debug serial captures
        if: always()
        shell: bash
        working-directory: helios
        run: python3 tools/debug-serial-report.py "$GITHUB_WORKSPACE/smoke-runtime"
      - name: Upload the inspector runtime directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-runtime
          # The guest console and QEMU's own stdout, stderr and -d logs.
          # A failing smoke needs its evidence to leave the job as a file
          # rather than as console output.
          path: |
            smoke-runtime/*/*.log
            smoke-runtime-measured/*/*.log
          if-no-files-found: warn
          retention-days: 7
      # Each boot above rebuilds the bootfs for its own `--boot-program`
      # selection, so what the target directory holds now is the last
      # boot's subset. A build with no selection is the superset every
      # workload class boots from; the kernel, built against the fetched
      # profile, is not relinked.
      - name: Build the full guest image
        id: guest-image
        # A lane that failed before it built the inspector has nothing
        # to build an image with.
        if: always() && hashFiles('helios/target/release/helios-inspector') != ''
        working-directory: helios
        run: ./target/release/helios-inspector vm --arch x86-64 --release build
      # The image a `--no-build` boot needs on another host, laid out as
      # the paths under `target/` the inspector reads: unpacked into
      # `target/`, it is the whole installation (docs/boot.md). The
      # manifest and the key files are not part of it: nothing on the
      # `--no-build` path reads them, and the manifest records this
      # runner's absolute paths. The root key pair is generated per
      # build, so the signing key the kernel carries belongs to this
      # image alone. The compiler plugin's core module rides along: the
      # bench's Linux + Wasmtime column runs the build the bootfs
      # precompiled (tools/bench/native/build.sh, compiler-host/).
      - name: Upload the guest image
        if: always() && steps.guest-image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: helios-guest-x86-64
          path: |
            helios/target/x86_64-unknown-none/profile-use/helios
            helios/target/kernel-prebuild/x86_64-unknown-none/profile-use/helios-bootfs
            helios/target/kernel-prebuild/x86_64-unknown-none/profile-use/compiler_plugin.wasm
          if-no-files-found: error
          retention-days: 90

  # The 3D path against a real renderer: `gpu-test` opens a virgl
  # context, retires a fence on it, maps a host blob and a guest blob,
  # and runs a second instance beside the first, on a `virtio-gpu-gl`
  # device with Venus whose host renders through lavapipe (#505).
  # Ubuntu 24.04's QEMU 8.2 has no Venus (it arrived in 9.2) and its
  # virglrenderer is built without it, so the lane builds the same
  # pinned QEMU as `smoke-aarch64` against a pinned virglrenderer and
  # caches both install prefixes by version and build flags. Nothing
  # else is cached: the lane builds the development profile cold, which
  # also keeps it off the kernel profile a `--release` x86-64 kernel
  # needs.
  smoke-x86-64-venus:
    name: smoke-x86-64-venus
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'smoke-x86-64-venus')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: "3600"
      QEMU_VERSION: "11.1.1"
      # The same tarball `smoke-aarch64` pins.
      QEMU_SHA256: 079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482
      QEMU_PREFIX: ${{ github.workspace }}/qemu-install
      VIRGL_VERSION: "1.3.0"
      # The release publishes no tarball; this is the digest of GitLab's
      # archive of the tag (commit ca50e008863837e094747a69974dde3ae148aeaa).
      VIRGL_SHA256: 065bc56e89e6f631f96101cd62eba0748e48eb888b434edc86e89d05395e76f3
      VIRGL_PREFIX: ${{ github.workspace }}/virglrenderer-install
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - name: Install host dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update
          # The build dependencies of both pinned builds, Mesa's lavapipe
          # as the host Vulkan driver.
          sudo apt-get install -y --no-install-recommends \
            libudev-dev just cmake ninja-build meson ovmf \
            python3-venv pkg-config flex bison \
            libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev \
            libepoxy-dev libdrm-dev libgbm-dev libvulkan-dev \
            mesa-vulkan-drivers libegl-mesa0
          # vgem gives a GPU-less runner the render node QEMU's EGL
          # context opens; the azure kernel's own modules package carries
          # it. No udmabuf: QEMU needs it for blobs only when neither virgl
          # nor rutabaga backs the device (hw/display/virtio-gpu.c), and
          # virgl hands guest blobs to virglrenderer as iovecs.
          sudo modprobe vgem
          sudo chmod 666 /dev/kvm /dev/dri/renderD*
          ls -la /dev/kvm /dev/dri
          # lavapipe is the only Vulkan driver this runner can enumerate;
          # naming it keeps the loader from probing the hardware ones.
          # Mesa 25's package names the ICD without an architecture suffix.
          icd=/usr/share/vulkan/icd.d/lvp_icd.json
          test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - name: Restore the pinned virglrenderer install prefix
        id: virgl-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VIRGL_PREFIX }}
          key: virglrenderer-${{ env.VIRGL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/.github/qemu/virglrenderer-meson.args') }}
      - name: Build the pinned virglrenderer
        if: steps.virgl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tarball="virglrenderer-${VIRGL_VERSION}.tar.gz"
          curl -fsSLO "https://gitlab.freedesktop.org/virgl/virglrenderer/-/archive/${VIRGL_VERSION}/${tarball}"
          echo "${VIRGL_SHA256}  ${tarball}" | sha256sum -c -
          tar xf "${tarball}"
          # The flags live in a file the cache key hashes.
          mapfile -t flags < "${GITHUB_WORKSPACE}/helios/.github/qemu/virglrenderer-meson.args"
          meson setup "virglrenderer-${VIRGL_VERSION}/build" "virglrenderer-${VIRGL_VERSION}" \
            --prefix="${VIRGL_PREFIX}" "${flags[@]}"
          ninja -C "virglrenderer-${VIRGL_VERSION}/build" install
      - name: Restore the pinned QEMU install prefix
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QEMU_PREFIX }}
          # QEMU links the virglrenderer above, so its key carries that
          # build's too.
          key: qemu-venus-${{ env.QEMU_VERSION }}-virglrenderer-${{ env.VIRGL_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/.github/qemu/x86_64-venus-configure.args', 'helios/.github/qemu/virglrenderer-meson.args') }}
      - name: Build the pinned QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        env:
          PKG_CONFIG_PATH: ${{ env.VIRGL_PREFIX }}/lib/pkgconfig
        run: |
          set -euo pipefail
          tarball="qemu-${QEMU_VERSION}.tar.xz"
          curl -fsSLO "https://download.qemu.org/${tarball}"
          echo "${QEMU_SHA256}  ${tarball}" | sha256sum -c -
          tar xf "${tarball}"
          cd "qemu-${QEMU_VERSION}"
          # The flags live in a file the cache key hashes.
          mapfile -t flags < "${GITHUB_WORKSPACE}/helios/.github/qemu/x86_64-venus-configure.args"
          ./configure --prefix="${QEMU_PREFIX}" "${flags[@]}"
          # QEMU has no --enable-gbm: meson probes gbm as optional once
          # OpenGL is on, and egl-headless needs it to open the render node.
          grep -E '^#define CONFIG_GBM\b' build/config-host.h
          ninja -C build install
      - name: Put the pinned QEMU and virglrenderer in use
        run: |
          echo "${QEMU_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=${VIRGL_PREFIX}/lib" >> "$GITHUB_ENV"
      - name: Record the QEMU in use
        run: |
          command -v qemu-system-x86_64
          qemu-system-x86_64 --version
          qemu-system-x86_64 -device virtio-gpu-gl-pci,help | grep -F venus
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Stage Limine bootloader share
        run: |
          git clone --depth 1 --branch v11.x-binary \
            https://github.com/limine-bootloader/limine "$GITHUB_WORKSPACE/limine"
          make -C "$GITHUB_WORKSPACE/limine"
      # The boot programs `tools/wasi-apps/boot-artifacts.toml` names,
      # under the key every lane shares.
      - name: Restore WASI tooling artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            helios/artifacts/wasi-tools
            helios/artifacts/python3-root
            helios/artifacts/wasix
          key: wasi-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('helios/tools/wasi-apps/**', 'helios/Cargo.lock') }}
      - name: Stage WASI tooling artifacts
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        working-directory: helios
        run: tools/wasi-apps/build.sh
      - name: Build inspector
        working-directory: helios
        run: cargo build -p helios-inspector
      - name: Run gpu-test against Venus
        # The debug build and the boot take a few minutes; a fence the
        # host never retires otherwise holds the step until the job's limit.
        timeout-minutes: 20
        shell: bash
        working-directory: helios
        run: |
          # Without this the step reports tee's status, not the
          # command's, and a runner script that fails is invisible.
          set -o pipefail
          runtime="$GITHUB_WORKSPACE/smoke-runtime/venus"
          mkdir -p "$runtime"
          # `--renderer` makes the desktop's GPU `virtio-gpu-gl` with
          # Venus and blobs and backs the guest's RAM with a shared memfd;
          # `egl-headless` is the GL context it renders through.
          ./target/debug/helios-inspector vm --arch x86-64 --memory 2G \
            --accel kvm \
            --runtime-dir "$runtime" --keep-runtime-dir \
            --renderer virtio-gpu-gl --renderer-hostmem 256M \
            --display egl-headless \
            --boot-program dash --boot-program debugger \
            --boot-program gpu-test --no-compiler-plugin \
            shell -c 'gpu-test --expect-renderer && echo gpu-ok' \
            2>&1 > venus-smoke.out | tee "$runtime/inspector.log"
          cat venus-smoke.out
          grep -Fqx gpu-ok venus-smoke.out
          # What the device negotiated, on the kernel's boot line.
          grep -aFq '3d=virgl blob=on context-init=on' "$runtime/debug-serial.log"
          # Each step the program reports: the context's fence, both
          # blobs written and read back, and the second instance.
          for line in 'gpu-test:opened' 'gpu-test:fence ring=0' \
              'gpu-test:host-blob ok' 'gpu-test:guest-blob ok' \
              'gpu-test:instances=2'; do
            grep -Fq "$line" venus-smoke.out
          done
      - name: Upload the inspector runtime directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86-64-venus-runtime
          path: |
            smoke-runtime/*/*.log
            helios/venus-smoke.out
          if-no-files-found: warn
          retention-days: 7
