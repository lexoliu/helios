name: kernel-profile

# The `-C profile-generate` collection of docs/pgo.md, on demand (#313).
#
# Every x86-64 release build spends the kernel profile this workflow
# uploads (#226): one `helios-kernel-profdata` artifact holding the merged
# `helios-kernel.profdata`, collected on the lane's own machine by
# `.github/actions/collect-kernel-profile`. It runs on every push to `dev`
# that touches what the kernel image is built from (#385): `helios-cli
# profile-fetch` spends the newest collection on the default branch, and
# between a monthly collection and the next `dev` merged kernel changes
# several times a day — `dev` at 9541b9ec built 3,377 of 27,500 functions
# uncovered against the profile collected at 5fe1df2b, and a release
# kernel built that way is optimised on the profile of another kernel.
# A burst of merges collects once, for the newest: an in-flight push
# collection is cancelled by the next, so the last artifact uploaded is
# the last commit's rather than whichever run finished last. It can still
# be dispatched by hand, and runs on a schedule so the artifact never
# ages past GitHub's retention: a lane that fetches an expired profile
# fails at the fetch, by design.
#
# `bench-suite.yml`'s `profile-generate` job calls this workflow, so the
# profile `suite-pgo` spends and the one a release build reads come from
# one job; `release.yml` runs the same composite action on the released
# tree and attaches what it collected to the release. A profile collected
# two ways would be two profiles wearing one name.
#
# Only the profile is uploaded. A kernel image embeds the bootfs signing
# material and is never a workflow artifact.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    # What the x86-64 kernel image and the workloads it is profiled on
    # are built from: the kernel crates and their layers below (§1 of
    # AGENTS.md), the backend, the root crate, the guest programs the
    # bootfs embeds, the workload manifest and the WASI apps the
    # collection boots, the collection sequence itself, and the Wasmtime
    # pin. A merge that touches none of these leaves the profile as it
    # was.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "src/**"
      - "hal/**"
      - "netstack/**"
      - "virtio/**"
      - "i6300esb/**"
      - "compiler-abi/**"
      - "artifact/**"
      - "kernel/**"
      - "kernel-macro/**"
      - "x86/**"
      - "api/**"
      - "api-macro/**"
      - "programs/**"
      - "compiler-plugin/**"
      - "wit/**"
      - "tools/bench/manifest.toml"
      - "tools/wasi-apps/**"
      - "docs/wasmtime.md"
      - ".github/actions/**"
      - ".github/workflows/kernel-profile.yml"
  schedule:
    # The first of every month. Artifacts live ninety days at most.
    - cron: "17 3 1 * *"
  workflow_call:

jobs:
  kernel-profile:
    name: kernel-profile
    runs-on: ubuntu-24.04
    # A push collection is superseded by the next push: the newest
    # commit's profile is the one `profile-fetch` should find newest, so
    # the older run is cancelled rather than left to finish last. Every
    # other event gets a group of its own — a dispatch, or the call from
    # `bench-suite.yml`, whose own concurrency already governs it.
    concurrency:
      group: >-
        ${{ github.event_name == 'push'
            && format('kernel-profile-push-{0}', github.ref)
            || format('kernel-profile-{0}-{1}', github.run_id, github.job) }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # The lane whose workloads and machine the profile describes: the
      # one benchmark lane of AGENTS.md §3.6.
      BENCH_LANE: x86-64-kvm
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - uses: ./helios/.github/actions/bench-host
        with:
          rust-cache-key: kernel-profile
          network-tools: "true"
          bench-tooling: "true"
      - uses: ./helios/.github/actions/collect-kernel-profile
        with:
          lane: ${{ env.BENCH_LANE }}
          limine-dir: ${{ github.workspace }}/limine
          output: ${{ github.workspace }}/profiles/helios-kernel.profdata
      - uses: actions/upload-artifact@v4
        with:
          name: helios-kernel-profdata
          path: profiles/helios-kernel.profdata
          if-no-files-found: error
          retention-days: 90
