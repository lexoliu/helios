name: bench-suite

# The publishable three-way comparison: Helios, Linux + Wasmtime and native
# Linux on the same machine, accelerator and virtio devices, one lane per
# architecture (docs/benchmarks.md).
#
# Two modes select the runner and the report's status:
#   - dedicated: the self-hosted `helios-bench-*` machines; the report is
#     publishable and the gate blocks on headline regressions. Taken by
#     pushes to dev and by tags once the repository variable
#     HELIOS_BENCH_DEDICATED is `true`, or by dispatching with
#     advisory=false.
#   - advisory: GitHub's shared runners; the report is marked
#     non-publishable, the gate only comments. Taken by dispatch (the
#     default) and by pull requests carrying the `bench` label.
#
# A pull request also runs **paired**: a second Helios image is built from
# the merge base with dev and every workload is booted for both images
# back to back on the one runner. That comparison carries no change of
# machine, so its half of the gate blocks on a headline regression even
# though the report itself is advisory (#173).

on:
  workflow_dispatch:
    inputs:
      advisory:
        description: Run on the shared runners and mark the report non-publishable
        type: boolean
        default: true
      lanes:
        description: Lanes to run
        type: choice
        options: [all, x86-64-kvm]
        default: all
      iterations:
        description: Iterations per cell (empty = manifest default)
        type: string
        default: ""
      baseline_ref:
        description: >-
          Git ref to pair against: a second Helios image is built from it and
          timed beside this one on the same host (empty = no pairing)
        type: string
        default: ""
      baseline_kernel_build:
        description: >-
          How the second image is built. `release` builds it without the
          fetched kernel profile, the plain control of a PGO measurement:
          alone, this commit's profile-guided kernel against its plain one
        type: choice
        options: [profile-use, release]
        default: profile-use
      tcp_probe:
        description: Diagnose paired TCP reconnects with single-queue packet capture; not performance acceptance
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
    tags: ["v*"]

# A push supersedes the previous push and a dispatch the previous
# dispatch. The event is part of the group because a push to `dev` runs
# only `tooling`, and in one group with a dispatched measurement it
# cancelled that measurement hours in (#318).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HELIOS_NET_IFNAME: helios0
  HELIOS_NET_BRIDGE: helios-br0

jobs:
  tooling:
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      # Advisory unless this is a dedicated-runner event; `runs-on` below
      # reads it through the needs context, the only one it can read.
      advisory: ${{ steps.mode.outputs.advisory }}
      paired_acceptance: ${{ steps.mode.outputs.paired_acceptance }}
      # The suite's matrix, from tools/bench/manifest.toml: the lanes have
      # one definition.
      matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ADVISORY: ${{ inputs.advisory }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
          BASELINE_KERNEL_BUILD: ${{ inputs.baseline_kernel_build }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "advisory=$REQUESTED_ADVISORY" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = pull_request ]; then
            echo "advisory=true" >> "$GITHUB_OUTPUT"
          else
            echo "advisory=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REQUESTED_ADVISORY" = true ] \
            && { [ -n "$BASELINE_REF" ] || [ "$BASELINE_KERNEL_BUILD" = release ]; }; then
            echo "paired_acceptance=true" >> "$GITHUB_OUTPUT"
          else
            echo "paired_acceptance=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint and test tools/bench
        working-directory: tools/bench
        run: |
          uv sync --quiet
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - id: lanes
        working-directory: tools/bench
        run: |
          select="${{ github.event_name == 'workflow_dispatch' && inputs.lanes || 'all' }}"
          echo "matrix=$(uv run helios-bench lanes --select "$select" --format github-matrix)" >> "$GITHUB_OUTPUT"
      - name: Verify the committed README and docs sections match their run's report
        working-directory: tools/bench
        run: uv run helios-bench render check
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build the native counterparts
        run: tools/bench/native/build.sh x86_64

  suite:
    name: suite-${{ matrix.lane }}
    needs: tooling
    # Heavy: only on dispatch, labelled PRs, tags, and dev pushes once the
    # dedicated machines exist.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'push' && vars.HELIOS_BENCH_DEDICATED == 'true')
    runs-on: ${{ needs.tooling.outputs.advisory == 'true' && matrix.shared-runner || matrix.dedicated-runner }}
    permissions:
      contents: read
      actions: read
    env:
      BENCH_ADVISORY: ${{ needs.tooling.outputs.advisory }}
      BENCH_PAIRED_ACCEPTANCE: ${{ needs.tooling.outputs.paired_acceptance }}
      HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
      HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
      HELIOS_BOOT_SYNC_TIMEOUT_SECS: ${{ matrix.boot-timeout }}
      HELIOS_WORKLOAD_BENCH_RUNTIME_DIR: ${{ github.workspace }}/bench-runtime
      BENCH_BASELINE_REF: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha
            || inputs.baseline_ref }}
      BENCH_BASELINE_KERNEL_BUILD: ${{ inputs.baseline_kernel_build }}
    timeout-minutes: ${{ inputs.tcp_probe && 40 || 420 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tooling.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
          # The paired mode builds a git worktree of the commit this pull
          # request branched from, so the checkout has to carry history
          # rather than the single commit a default checkout fetches.
          fetch-depth: 0
      - uses: ./helios/.github/actions/checkout-wasmtime
      - uses: ./helios/.github/actions/bench-host
        with:
          rust-cache-key: bench-suite-${{ matrix.lane }}
          network-tools: ${{ matrix.net-backend == 'tap' }}
          guest-arch: ${{ matrix.guest-arch }}
          flamegraphs: "true"
          inspector: "true"
          bench-tooling: "true"
      # Every x86-64 release build is built against the kernel profile
      # the newest kernel-profile.yml run on the default branch uploaded
      # (docs/pgo.md, #226, #313); the inspector refuses to build one
      # without it rather than producing a plain kernel wearing a PGO
      # label, so the fetch comes before the build. Reading the artifact
      # is what the job's `actions: read` is for.
      - name: Fetch the kernel profile
        if: matrix.helios-arch == 'x86-64'
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release -p helios-cli -- profile-fetch
      - name: Report host deviations from the lane
        working-directory: helios/tools/bench
        run: uv run helios-bench host-check --lane ${{ matrix.lane }} || true
      - name: Provision the tap network backend
        if: matrix.net-backend == 'tap'
        working-directory: helios
        env:
          TCP_PROBE: ${{ inputs.tcp_probe }}
        run: |
          queues="$(nproc)"
          if [ "$TCP_PROBE" = true ]; then queues=1; fi
          ./target/release/helios-inspector vm net-setup \
            --net-backend tap --net-queues "$queues" \
            --net-ifname "${HELIOS_NET_IFNAME}" \
            --net-bridge "${HELIOS_NET_BRIDGE}" \
            --net-dhcp
      - name: Run TCP reconnect probe
        if: inputs.tcp_probe
        working-directory: helios/tools/bench
        env:
          HELIOS_WORKLOAD_BENCH_NET_PCAP: "1"
        run: |
          if [ -z "$BENCH_BASELINE_REF" ]; then
            echo "::error::tcp_probe requires baseline_ref"
            exit 1
          fi
          args=(run --lane "${{ matrix.lane }}" --out-dir "$GITHUB_WORKSPACE/bench-out/${{ matrix.lane }}"
                --runner-label "${{ runner.name }}" --advisory --allow-busy-host
                --sides "helios,helios_baseline" --baseline-ref "$BENCH_BASELINE_REF"
                --workload tcp-throughput --iterations 2 --net-queues 1 --reuse-host-listeners)
          if [ "${{ matrix.net-backend }}" = tap ]; then
            args+=(--net-ifname "$HELIOS_NET_IFNAME" --net-bridge "$HELIOS_NET_BRIDGE")
          fi
          uv run helios-bench "${args[@]}"
      - name: Run the suite
        if: ${{ !inputs.tcp_probe }}
        working-directory: helios/tools/bench
        run: |
          args=(run --lane "${{ matrix.lane }}" --out-dir "$GITHUB_WORKSPACE/bench-out/${{ matrix.lane }}"
                --runner-label "${{ runner.name }}")
          # instance-startup-500 wants about 6.1 GiB of guest before the
          # kernel's own baseline and the lane guest has less, so its
          # Helios half cannot be measured on this machine and a Linux
          # number for it would have nothing to compare against — and the
          # Linux side shares one budget out between the workloads it runs,
          # so an uncomparable one takes its share from the rest. The
          # Helios side still runs it: its failure is a recorded cell in
          # the report. instance-startup-100 measures on both sides since
          # #130 and #159 (docs/memory.md).
          args+=(--skip-linux-workload instance-startup-500)
          if [ "${BENCH_ADVISORY}" = true ]; then
            args+=(--advisory --allow-busy-host)
          fi
          if [ -n "${{ inputs.iterations }}" ]; then
            args+=(--iterations "${{ inputs.iterations }}")
          fi
          # A pull request is timed against the commit it branched from,
          # named by its base SHA rather than recomputed: that is the
          # merge base GitHub itself used, and it is in the checkout
          # because this job fetched the history.
          if [ -n "${BENCH_BASELINE_REF}" ]; then
            args+=(--baseline-ref "${BENCH_BASELINE_REF}")
          fi
          if [ "${BENCH_BASELINE_KERNEL_BUILD}" = release ]; then
            args+=(--baseline-kernel-build release)
          fi
          if [ "${BENCH_PAIRED_ACCEPTANCE}" = true ]; then
            args+=(--sides "helios,helios_baseline")
          fi
          if [ "${{ matrix.net-backend }}" = tap ]; then
            args+=(--net-ifname "${HELIOS_NET_IFNAME}" --net-bridge "${HELIOS_NET_BRIDGE}" --net-queues "$(nproc)")
          fi
          uv run helios-bench "${args[@]}"
      # Keep-going records failed workloads without failing this step.
      # Preserve their raw console and QEMU logs even when the suite
      # returns success, so the separate gate can name incomplete
      # evidence without losing the diagnostic record behind it.
      - name: Export benchmark function symbols
        if: always()
        working-directory: helios/tools/bench
        run: uv run helios-bench symbols --root ../.. --out-dir "$GITHUB_WORKSPACE/kernel-symbols"
      - name: Upload the inspector runtime directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-runtime-${{ matrix.lane }}
          # The uncovered-function lists land beside the kernels the
          # lane built (helios/target/…/profile-use/), not under
          # bench-runtime; they ride the same upload so the step log's
          # `full list:` path stays resolvable (#329).
          path: |
            bench-runtime/**/*.log
            bench-runtime/**/*.pcap
            kernel-symbols/**/*.symbols.json
            helios/target/**/helios.pgo-uncovered.txt
          if-no-files-found: warn
      - name: Remove the tap network backend
        if: always() && matrix.net-backend == 'tap'
        working-directory: helios
        run: |
          ./target/release/helios-inspector vm net-teardown \
            --net-backend tap \
            --net-ifname "${HELIOS_NET_IFNAME}" \
            --net-bridge "${HELIOS_NET_BRIDGE}"
      - name: Publish the tables to the step summary
        if: always()
        run: |
          tables="$GITHUB_WORKSPACE/bench-out/${{ matrix.lane }}/tables.md"
          if [ -f "$tables" ]; then cat "$tables" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.tcp_probe && format('tcp-probe-{0}', matrix.lane) || format('bench-report-{0}', matrix.lane) }}
          path: |
            bench-out/${{ matrix.lane }}/report.json
            bench-out/${{ matrix.lane }}/tables.md
            bench-out/${{ matrix.lane }}/*.svg
            bench-out/${{ matrix.lane }}/helios/*.jsonl
            bench-out/${{ matrix.lane }}/helios/*.md
            bench-out/${{ matrix.lane }}/helios-baseline/*.jsonl
            bench-out/${{ matrix.lane }}/linux/*.jsonl
            bench-out/${{ matrix.lane }}/linux/*.md
            bench-out/${{ matrix.lane }}/linux/summary.json
          if-no-files-found: warn
          retention-days: 90

  # The profile-guided-optimisation feed of docs/pgo.md. It boots an
  # instrumented kernel — one that counts every branch it takes — runs the
  # suite's workloads on it, and uploads the merged profile. It reports no
  # numbers and its lane is not a benchmark surface: instrumentation changes
  # scheduling, so anything timed here would measure the counters.
  #
  # The job is `kernel-profile.yml`, the workflow that collects the same
  # profile on demand for every x86-64 release build to spend (#226,
  # #313), called here so that what `suite-pgo` measures and what a
  # release build reads come from one job rather than two copies of it.
  profile-generate:
    name: profile-generate
    needs: tooling
    # Full suite events retain profiling; advisory revision acceptance
    # measures its two images without an independent PGO experiment.
    if: >-
      needs.tooling.outputs.paired_acceptance != 'true'
      && !inputs.tcp_probe
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'bench'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'push' && vars.HELIOS_BENCH_DEDICATED == 'true'))
    uses: ./.github/workflows/kernel-profile.yml

  # The other half of docs/pgo.md: the profile the job above collected,
  # spent. One commit is built twice — the plain release kernel and the
  # same kernel compiled against the profile — and the paired suite of
  # #173 boots both back to back for every workload on this host, so what
  # separates the two columns is profile-guided optimisation and nothing
  # else (#211).
  suite-pgo:
    name: suite-pgo
    needs: profile-generate
    # Same events as the job that produces the profile: without one there
    # is nothing to build against.
    if: needs.profile-generate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      # The profile is collected from an x86-64 kernel, so this is the
      # lane that can spend it; a profile carries function hashes of the
      # target it was collected on and no other lane could read it.
      BENCH_LANE: x86-64-kvm
    steps:
      - uses: actions/checkout@v4
        with:
          path: helios
      - uses: ./helios/.github/actions/checkout-wasmtime
      - uses: ./helios/.github/actions/bench-host
        with:
          rust-cache-key: suite-pgo
          network-tools: "true"
          flamegraphs: "true"
          inspector: "true"
          bench-tooling: "true"
      - name: Read the lane
        id: lane
        working-directory: helios/tools/bench
        run: |
          # The lane's pins have one definition, tools/bench/manifest.toml,
          # and this job is not a matrix job, so it reads the entry the
          # matrix would have carried rather than repeating its values.
          entry="$(uv run helios-bench lanes --select "${BENCH_LANE}" --format github-matrix | jq -c '.[0]')"
          for field in boot-timeout net-backend; do
            printf '%s=%s\n' "$field" "$(printf '%s' "$entry" | jq -r --arg f "$field" '.[$f]')" \
              >> "$GITHUB_OUTPUT"
          done
      # The candidate's profile: the one this run collected. It lands in
      # the checkout so the paired table can name it as a path.
      - uses: actions/download-artifact@v4
        with:
          name: helios-kernel-profdata
          path: helios/target/pgo-candidate
      # Every x86-64 release build is built against the kernel profile
      # the newest kernel-profile.yml run on the default branch uploaded
      # (docs/pgo.md, #226, #313); the inspector refuses to build one
      # without it rather than producing a plain kernel wearing a PGO
      # label, so the fetch comes before the build. Reading the artifact
      # is what the job's `actions: read` is for.
      - name: Fetch the kernel profile
        working-directory: helios
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release -p helios-cli -- profile-fetch
      - name: Provision the multi-queue tap network backend
        if: steps.lane.outputs.net-backend == 'tap'
        working-directory: helios
        run: |
          ./target/release/helios-inspector vm net-setup \
            --net-backend tap \
            --net-ifname "${HELIOS_NET_IFNAME}" \
            --net-bridge "${HELIOS_NET_BRIDGE}" \
            --net-dhcp
      - name: Time the profile-guided kernel against the plain one
        working-directory: helios/tools/bench
        env:
          HELIOS_LIMINE_SHARE: ${{ github.workspace }}/limine
          HELIOS_LIMINE_BIN: ${{ github.workspace }}/limine/limine
          HELIOS_BOOT_SYNC_TIMEOUT_SECS: ${{ steps.lane.outputs.boot-timeout }}
          HELIOS_WORKLOAD_BENCH_RUNTIME_DIR: ${{ github.workspace }}/bench-runtime
        run: |
          # Helios against Helios: the Linux sides answer a different
          # question (docs/benchmarks.md) and would double a job that
          # already boots every workload twice.
          args=(run --lane "${BENCH_LANE}" --out-dir "$GITHUB_WORKSPACE/bench-out/pgo"
                --runner-label "${{ runner.name }}"
                --sides "helios,helios_baseline"
                --profile-use "$GITHUB_WORKSPACE/helios/target/pgo-candidate/helios-kernel.profdata"
                --advisory --allow-busy-host)
          if [ -n "${{ inputs.iterations }}" ]; then
            args+=(--iterations "${{ inputs.iterations }}")
          fi
          if [ "${{ steps.lane.outputs.net-backend }}" = tap ]; then
            args+=(--net-ifname "${HELIOS_NET_IFNAME}" --net-bridge "${HELIOS_NET_BRIDGE}" --net-queues "$(nproc)")
          fi
          uv run helios-bench "${args[@]}"
      - name: Upload the inspector runtime directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-runtime-pgo
          path: bench-runtime/**/*.log
          if-no-files-found: warn
      - name: Upload the uncovered-function lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The two profile-use kernels this job builds leave their lists
          # beside their images under helios/target/ (#329); a green run's
          # step-log `full list:` path has to resolve too.
          name: bench-pgo-uncovered
          path: helios/target/**/helios.pgo-uncovered.txt
          if-no-files-found: warn
      - name: Remove the tap network backend
        if: always() && steps.lane.outputs.net-backend == 'tap'
        working-directory: helios
        run: |
          ./target/release/helios-inspector vm net-teardown \
            --net-backend tap \
            --net-ifname "${HELIOS_NET_IFNAME}" \
            --net-bridge "${HELIOS_NET_BRIDGE}"
      - name: Compare the two images
        if: always() && hashFiles('bench-out/pgo/report.json') != ''
        working-directory: helios/tools/bench
        run: |
          # The paired table is in the report: both columns were measured
          # here. What that table means, and why its verdict does not gate
          # this job, is prose and lives in a file rather than in a
          # printf: tools/bench/pgo-gate-note.md.
          exit_status=0
          uv run helios-bench gate \
            --candidate "$GITHUB_WORKSPACE/bench-out/pgo/report.json" \
            > "$GITHUB_WORKSPACE/pgo-table.md" || exit_status=$?
          {
            cat "$GITHUB_WORKSPACE/helios/tools/bench/pgo-gate-note.md"
            cat "$GITHUB_WORKSPACE/pgo-table.md"
            printf '\nhelios-bench gate exited %s.\n' "$exit_status"
          } > "$GITHUB_WORKSPACE/pgo-comment.md"
          cat "$GITHUB_WORKSPACE/pgo-comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('pgo-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # `--repo` because `gh` otherwise reads the repository off the
        # working directory's git remote, and this job checks out into
        # `helios/` while the step runs at the workspace root (#283).
        run: >-
          gh pr comment "${{ github.event.pull_request.number }}"
          --repo "$GITHUB_REPOSITORY"
          --body-file "$GITHUB_WORKSPACE/pgo-comment.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-pgo
          path: |
            bench-out/pgo/report.json
            bench-out/pgo/tables.md
            bench-out/pgo/*.svg
            bench-out/pgo/helios/*.jsonl
            bench-out/pgo/helios-baseline/*.jsonl
            pgo-comment.md
          if-no-files-found: warn
          retention-days: 90

  gate:
    name: gate-${{ matrix.lane }}
    needs: [tooling, suite]
    if: always() && needs.suite.result != 'skipped' && !inputs.tcp_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tooling.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: bench-report-${{ matrix.lane }}
          path: candidate
      - name: Fetch the latest dev baseline for this lane
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The baseline is the newest successful bench-suite run on dev that
          # published a report for this lane. Advisory candidates compare
          # against it informationally; the gate only enforces when both
          # reports came from dedicated runners.
          for run_id in $(gh run list --workflow bench-suite.yml --branch dev --status success \
                            --json databaseId --jq '.[].databaseId' --limit 20); do
            if gh run download "$run_id" --name "bench-report-${{ matrix.lane }}" --dir baseline 2>/dev/null; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no dev baseline with a bench-report-${{ matrix.lane }} artifact yet"
      - name: Compare
        shell: bash
        if: hashFiles('candidate/report.json') != ''
        working-directory: tools/bench
        run: |
          uv sync --quiet
          # The paired table comes out of the candidate report itself: it
          # is the second image this run timed on this runner. The
          # cross-run table needs the dev report, and there may be none.
          args=(gate --candidate "$GITHUB_WORKSPACE/candidate/report.json"
                --out "$GITHUB_WORKSPACE/gate.md")
          if [ -n "${{ steps.baseline.outputs.run_id }}" ]; then
            args+=(--baseline "$GITHUB_WORKSPACE/baseline/report.json")
          fi
          uv run helios-bench "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/gate.md" ]; then
            printf "### Benchmark gate, lane %s\n\nNeither a paired nor a dev baseline was available for this lane; the candidate tables are in the run artifacts.\n" \
              "${{ matrix.lane }}" > "$GITHUB_WORKSPACE/gate.md"
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$GITHUB_WORKSPACE/gate.md"

  release-assets:
    name: release-assets
    needs: suite
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-report-*
          path: reports
      - name: Attach the reports to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A paper cites the tag; the reports it cites are the release assets.
          for lane_dir in reports/bench-report-*; do
            lane="${lane_dir#reports/bench-report-}"
            tar -C "$lane_dir" -czf "bench-report-${lane}.tar.gz" .
            gh release upload "${GITHUB_REF_NAME}" "bench-report-${lane}.tar.gz" --clobber --repo "${GITHUB_REPOSITORY}"
          done
