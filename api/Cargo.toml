[package]
name = "helios-api"
version = "0.1.0"
edition.workspace = true

[features]
default = ["channel", "fs", "io", "net", "serial", "stats", "sync", "task", "tracing"]
channel = ["dep:async-channel"]
fs = ["dep:futures-lite"]
instances = []
io = ["dep:futures-io", "dep:futures-lite"]
net = []
programs = ["dep:futures-lite"]
profiling = []
serial = []
stats = []
sync = []
task = ["wit-bindgen/async-spawn"]
tracing = []

[dependencies]
async-channel = { version = "2.5.0", optional = true }
futures-io = { version = "0.3.31", optional = true }
futures-lite = { version = "2.6.1", optional = true }
helios-api-macro = { path = "../api-macro" }
wit-bindgen = { workspace = true, features = ["async", "macros", "realloc"] }
