[package]
name = "helios-api"
version = "0.1.0"
edition.workspace = true

[features]
default = ["channel", "fs", "http", "io", "net", "serial", "stats", "sync", "task", "tracing"]
audio = ["dep:thiserror"]
channel = ["dep:async-channel"]
compositor = ["surface"]
display = ["dep:thiserror"]
gpu = ["dep:thiserror"]
input = ["dep:helios-hal", "dep:thiserror"]
fs = ["dep:futures-lite"]
http = ["io", "dep:http", "dep:thiserror"]
http-handler = ["http"]
http-kit-io = ["http-handler", "task", "dep:executor-core", "dep:futures-lite", "dep:http-kit-io", "dep:thiserror"]
instances = []
io = ["dep:futures-io", "dep:futures-lite"]
net = []
programs = ["dep:futures-lite"]
profiling = []
serial = []
stats = []
surface = ["dep:thiserror"]
sync = []
task = ["wit-bindgen/async-spawn"]
tracing = []
vsock = []

[dependencies]
async-channel = { version = "2.5.0", optional = true }
executor-core = { version = "0.7.2", default-features = false, features = ["async-task", "std"], optional = true }
futures-io = { version = "0.3.34", optional = true }
futures-lite = { version = "2.6.1", optional = true }
helios-api-macro = { path = "../api-macro" }
helios-hal = { path = "../hal", optional = true }
http-kit-io = { git = "https://github.com/zen-rs/http-kit", branch = "main", default-features = false, optional = true }
http = { version = "1.5.0", optional = true }
thiserror = { version = "2.0.20", optional = true }
wit-bindgen = { workspace = true, features = ["async", "async-spawn", "macros", "realloc"] }

[lints]
workspace = true
