[package]
name = "helios-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
async-task = { version = "4.7.1", default-features = false }
atomic-waker = "1.1.2"
buddy_system_allocator = "0.12.0"
concurrent-queue = { version = "2.5.0", default-features = false }
critical-section = "1.2.0"
nu-ansi-term = { version = "0.50.3", default-features = false }
virtio-drivers = "0.13.0"
wasmtime = { version = "29.0", default-features = false, features = [] }
helios-hal.workspace = true
spinning_top = "0.3.0"
tracing.workspace = true
bitflags = "2.11.0"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
futures-lite = "2.6.1"
