[package]
name = "helios-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
async-task = { version = "4.7.1", default-features = false }
atomic-waker = "1.1.2"
buddy_system_allocator = "0.12.0"
concurrent-queue = { version = "2.5.0", default-features = false }
critical-section = "1.2.0"
nu-ansi-term = { version = "0.50.3", default-features = false }
objectpool = { version = "0.1.0", default-features = false, features = ["alloc"] }
virtio-drivers = "0.13.0"
helios-hal.workspace = true
spinning_top = "0.3.0"
tracing.workspace = true
bitflags = "2.11.0"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
futures-lite = "2.6.1"
wat = "1.241.2"

[target.'cfg(target_os = "none")'.dependencies]
wasmtime = { path = "../../wasmtime/crates/wasmtime", default-features = false, features = ["riscv64", "cranelift", "runtime"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
libc = "0.2.177"
wasmtime = { path = "../../wasmtime/crates/wasmtime", default-features = false, features = ["host-arch", "cranelift", "runtime", "custom-native-signals", "custom-sync-primitives", "custom-virtual-memory"] }
