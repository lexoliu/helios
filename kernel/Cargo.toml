[package]
name = "helios-kernel"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[features]
default = ["wasmtime-host"]
# Adapter-only runtime support. `wasmtime-wasi-io` must stay behind this
# feature; the core kernel and HAL no-default path must not depend on it.
wasmtime-runtime = ["dep:wasmtime", "dep:wasmtime-wasi-io"]
wasmtime-host = ["wasmtime-runtime"]
wasmtime-aarch64 = ["wasmtime-runtime", "wasmtime/custom-virtual-memory"]
wasmtime-x86 = ["wasmtime-runtime"]
wasmtime-riscv64 = ["wasmtime-runtime"]

[dependencies]
async-lock = { version = "3.4.2", default-features = false }
async-task = { version = "4.7.1", default-features = false }
atomic-waker = "1.1.2"
buddy_system_allocator = "0.12.0"
bytes = { version = "1.10.1", default-features = false }
concurrent-queue = { version = "2.5.0", default-features = false }
critical-section = "1.2.0"
event-listener = { version = "5.4.1", default-features = false, features = ["critical-section"] }
futures = { version = "0.3.31", default-features = false, features = ["alloc"] }
nu-ansi-term = { version = "0.50.3", default-features = false }
objectpool = { version = "0.1.0", default-features = false, features = ["alloc"] }
helios-artifact.workspace = true
helios-compiler-abi.workspace = true
helios-hal.workspace = true
thiserror = { version = "2.0.17", default-features = false }
tracing.workspace = true
bitflags = "2.11.0"
lru = { version = "0.16.3", default-features = false, features = ["hashbrown"] }
rand_chacha = { version = "0.3.1", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
smoltcp = { version = "0.13.0", default-features = false, features = ["alloc", "medium-ethernet", "multicast", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-dhcpv4", "socket-dns", "socket-icmp", "socket-tcp", "socket-udp"] }
spin = { version = "0.9.8", default-features = false, features = ["mutex", "once", "spin_mutex"] }
wasmparser = { version = "0.245.0", default-features = false, features = ["component-model"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
futures-lite = "2.6.1"
helios-kernel-macro.workspace = true
wasm-encoder = "0.245.0"

[build-dependencies]
askama = "0.15.6"
toml = "0.8.23"
walkdir = "2.5.0"
wit-component = "0.245.0"
wasmparser = "0.245.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "none")'.dependencies]
wasmtime = { path = "../../wasmtime/crates/wasmtime", optional = true, default-features = false, features = ["call-hook", "component-model", "component-model-async", "custom-native-signals", "custom-sync-primitives", "gc-null", "runtime", "threads"] }
wasmtime-wasi-io = { path = "../../wasmtime/crates/wasi-io", optional = true, default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
wasmtime = { path = "../../wasmtime/crates/wasmtime", optional = true, default-features = false, features = ["call-hook", "component-model", "component-model-async", "gc-null", "pooling-allocator", "runtime", "std", "threads"] }
wasmtime-wasi-io = { path = "../../wasmtime/crates/wasi-io", optional = true }
