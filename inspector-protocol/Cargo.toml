[package]
name = "helios-inspector-protocol"
version = "0.1.0"
edition = "2024"

[features]
default = ["host"]
host = ["dep:bytes", "dep:futures-core", "dep:tokio", "dep:tokio-util", "dep:wrpc-transport"]
guest = ["dep:helios-api"]

[dependencies]
anyhow = "1.0.100"
bytes = { version = "1.10.1", optional = true }
futures-core = { version = "0.3.31", optional = true }
futures-io = "0.3.31"
futures-lite = "2.6.1"
helios-api = { path = "../api", optional = true, default-features = false, features = ["fs", "instances", "profiling", "programs", "serial", "stats", "tracing"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["io-util", "sync"], optional = true }
tokio-util = { version = "0.7.16", features = ["compat"], optional = true }
wrpc-transport = { version = "0.28.4", default-features = false, optional = true }
wit-bindgen = { workspace = true, features = ["macros", "async"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["io-util"] }
