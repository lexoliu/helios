[package]
name = "helios-firmware"
version = "0.1.0"
edition.workspace = true

[features]
default = ["acpi", "devicetree"]
# The SRAT/SLIT reader x86 and the aarch64 ACPI boot use.
acpi = ["dep:acpi"]
# The devicetree reader aarch64 and riscv use.
devicetree = ["dep:fdt"]

[dependencies]
acpi = { workspace = true, optional = true }
arrayvec = { version = "0.7.6", default-features = false }
fdt = { version = "0.1.5", default-features = false, optional = true }
helios-hal.workspace = true
thiserror = { version = "2.0.20", default-features = false }

[[test]]
name = "acpi"
required-features = ["acpi"]

[[test]]
name = "devicetree"
required-features = ["devicetree"]

[lints]
workspace = true
