[build]

[target.riscv64gc-unknown-none-elf]
rustflags = [
  "-C", "link-arg=-Tmemory.x",
  "-C", "link-arg=-Tlink.x",
]

[target.x86_64-unknown-none]
rustflags = [
  "-C", "target-feature=+sse,+sse2,-soft-float",
]

[target.aarch64-unknown-none]
rustflags = [
  "-C", "link-arg=-Taarch64/linker.ld",
  "-C", "link-arg=-zmax-page-size=0x1000",
  # ARMv8.1 LSE atomics (casal/ldaddal/swpal) replace ldxr/stxr LL/SC
  # retry loops; ARMv8.3 RCPC adds release-consistent loads (ldapr);
  # ARMv8.4 LSE2 lifts alignment requirements on atomics. Apple
  # Silicon, Ampere Altra, AWS Graviton 2+ all support this baseline.
  "-C", "target-feature=+lse,+rcpc,+lse2",
  # Every function that saves LR signs it (`paciasp`/`autiasp`, HINT-space
  # encodings that do nothing until the kernel enables the key on a
  # processor). rustc treats the flag as a target modifier, so `core`,
  # `alloc` and `compiler_builtins` must carry it too: every build of this
  # target passes `-Zbuild-std=core,alloc` (the Justfile's `check-target` and
  # `clippy-target`, the inspector's kernel build). `aarch64/build.rs` refuses
  # to compile the backend without this flag.
  "-Zbranch-protection=pac-ret",
]
