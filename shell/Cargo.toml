[package]
name = "helios-shell"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
async-io = "2.6.0"
async-net = "2.0.0"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.28.1"
futures-io = "0.3.31"
futures-lite = "2.6.1"
hex = "0.4.3"
helios-shell-protocol.workspace = true
ratatui = "0.29.0"
rustyline = "14.0.0"
rustix = { version = "1.1.4", features = ["termios", "std"] }
serialport = "4.9.0"
