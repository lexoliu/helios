[package]
name = "helios-curl"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
chunked_transfer = "1.5.0"
helios-api = { path = "../../api", default-features = false, features = ["net"] }
http = "1.3.1"
httparse = "1.10.1"

[lib]
name = "helios_curl"
path = "src/main.rs"
crate-type = ["cdylib"]
