[package]
name = "helios-compositor"
version = "0.1.0"
edition.workspace = true
autobins = false

[dependencies]
helios-api = { path = "../../api", default-features = false, features = [
    "channel",
    "compositor",
    "display",
    "input",
    "io",
    "programs",
    "task",
] }
helios-compositor-render = { path = "render" }
thiserror = { version = "2.0.20", default-features = false }

[lib]
name = "helios_compositor"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
