[package]
name = "helios-compositor"
version = "0.1.0"
edition.workspace = true
autobins = false

[dependencies]
helios-api = { path = "../../api", default-features = false, features = [
    "channel",
    "compositor",
    "display",
    "input",
    "io",
    "programs",
    "task",
] }
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = [
    "regular",
    "size_16",
    "unicode-basic-latin",
] }
thiserror = { version = "2.0.20", default-features = false }

[lib]
name = "helios_compositor"
path = "src/main.rs"
# `cdylib` is the component the kernel loads; `rlib` is what lets the
# host-side pixel check link the very modules the desktop draws with, so
# the check and the compositor cannot disagree about a glyph, a colour or
# a cell.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
