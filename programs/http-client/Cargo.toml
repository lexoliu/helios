[package]
name = "helios-http-client"
version = "0.1.0"
edition.workspace = true
autobins = false

[dependencies]
futures-channel = { version = "0.3.34", default-features = false, features = ["alloc"] }
futures-lite = { version = "2.6.1", default-features = false }
helios-api = { path = "../../api", default-features = false, features = ["http-handler", "http-kit-io", "task"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
zenwave = { git = "https://github.com/zen-rs/zenwave", branch = "main", default-features = false, features = ["native-backend"] }

[lib]
name = "helios_http_client"
path = "src/main.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
