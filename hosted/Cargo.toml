[package]
name = "helios-hosted"
version = "0.1.0"
edition.workspace = true

[features]
default = ["embedded-debugger"]
embedded-debugger = ["helios-kernel/embedded-debugger"]

[dependencies]
blocking = "1.6.2"
critical-section = { version = "1.2.0", features = ["std"] }
crossbeam-channel = "0.5.15"
helios-hal.workspace = true
helios-kernel = { workspace = true, default-features = false, features = ["wasmtime-host"] }
getrandom = "0.3.4"
futures-lite = "2.6.1"
libc = "0.2.186"
mimalloc = "0.1.48"
thiserror = { version = "2.0.17", default-features = false }
tracing.workspace = true

[dev-dependencies]
helios-inspector-protocol.workspace = true
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
wasm-encoder = "0.245.0"

[lints]
workspace = true
