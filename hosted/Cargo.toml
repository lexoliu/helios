[package]
name = "helios-hosted"
version = "0.1.0"
edition = "2024"

[dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
crossbeam-channel = "0.5.15"
futures = "0.3.31"
futures-lite = "2.6.1"
helios-hal.workspace = true
helios-kernel.workspace = true
mimalloc = "0.1.48"
shell-words = "1.1.0"
strip-ansi-escapes = "0.2.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tracing.workspace = true
wasmtime = { path = "../../wasmtime/crates/wasmtime", default-features = false, features = ["call-hook", "component-model", "component-model-async", "cranelift", "runtime", "std"] }
wasmtime-wasi = { path = "../../wasmtime/crates/wasi", default-features = false, features = ["p2", "p3"] }

[dev-dependencies]
helios-inspector-protocol.workspace = true
tokio-util = { version = "0.7.16", features = ["compat"] }
wasm-encoder = "0.245.0"
